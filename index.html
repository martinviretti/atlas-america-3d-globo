<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Atlas América 3D — Explora, aprende y domina los países y capitales de América con un globo 3D interactivo.">
<meta name="color-scheme" content="dark">
<title>Atlas América 3D</title>
<style>
/* ============================================================
   ATLAS AMÉRICA 3D — Sistema de diseño
   ============================================================ */
:root{
  /* Fondos */
  --bg-0:#070b16; --bg-1:#0b1120; --bg-2:#111a2e; --bg-3:#17223b;
  --panel:rgba(17,26,46,.78); --panel-2:rgba(23,34,59,.86); --panel-solid:#131d33;
  --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.06);
  /* Texto */
  --text:#eef2fb; --text-dim:#aeb9d4; --text-mute:#7a89ab; --text-inv:#08122a;
  /* Marca / acento */
  --accent:#38bdf8; --accent-2:#22d3ee; --accent-ink:#062a36;
  --focus:#7dd3fc;
  /* Regiones */
  --r-norte:#6aa9ff; --r-central:#ffb454; --r-caribe:#37d6b3; --r-sur:#c58bfa;
  --r-norte-d:rgba(106,169,255,.18); --r-central-d:rgba(255,180,84,.18);
  --r-caribe-d:rgba(55,214,179,.18); --r-sur-d:rgba(197,139,250,.18);
  /* Semántica */
  --ok:#34d399; --bad:#fb7185; --warn:#fbbf24; --info:#60a5fa;
  --ok-d:rgba(52,211,153,.16); --bad-d:rgba(251,113,133,.16); --warn-d:rgba(251,191,36,.16);
  /* Dominio */
  --m-nuevo:#64748b; --m-aprendiendo:#fbbf24; --m-practica:#38bdf8;
  --m-casi:#a78bfa; --m-dominado:#34d399; --m-repaso:#fb7185;
  /* Formas */
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:26px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.35);
  --sh-3:0 18px 48px rgba(0,0,0,.5); --glow:0 0 0 1px rgba(56,189,248,.5),0 0 22px rgba(56,189,248,.28);
  --sp:8px; --nav-h:60px;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:'Cascadia Code',ui-monospace,'SF Mono',Consolas,monospace;
  --t-fast:.16s; --t:.28s; --t-slow:.5s; --ease:cubic-bezier(.4,0,.2,1);
}
/* Alto contraste */
html[data-contrast="high"]{
  --panel:rgba(6,10,20,.96); --panel-2:rgba(8,14,28,.98);
  --border:rgba(255,255,255,.5); --border-2:rgba(255,255,255,.35);
  --text:#ffffff; --text-dim:#e8eefc; --text-mute:#c2ccdf;
  --accent:#7fdbff;
}
/* Escala de texto */
html[data-textsize="1"]{font-size:112.5%}
html[data-textsize="2"]{font-size:125%}
/* Movimiento reducido */
html[data-motion="reduced"] *,
html[data-motion="reduced"] *::before,
html[data-motion="reduced"] *::after{
  animation-duration:.001ms!important; animation-iteration-count:1!important;
  transition-duration:.001ms!important; scroll-behavior:auto!important;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); color:var(--text); background:var(--bg-0);
  background-image:radial-gradient(1200px 700px at 78% -8%,rgba(56,189,248,.10),transparent 60%),
                   radial-gradient(900px 600px at 8% 108%,rgba(197,139,250,.10),transparent 60%);
  -webkit-font-smoothing:antialiased; line-height:1.5; overflow-x:hidden;
}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.18;font-weight:700;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4vw,2.6rem)} h2{font-size:clamp(1.25rem,2.6vw,1.7rem)}
h3{font-size:1.12rem} p{margin:0 0 .8em} a{color:var(--accent)}
small{color:var(--text-mute)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font-family:inherit}
::selection{background:rgba(56,189,248,.35)}
/* scrollbars */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:20px}

/* Accesibilidad utilitaria */
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;border-radius:var(--r-sm);font-weight:700;transition:top var(--t)}
.skip:focus{top:12px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.visually-hidden{clip:rect(0 0 0 0)}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;gap:.5em;justify-content:center;
  padding:10px 16px;border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);font-weight:600;font-size:.95rem;
  cursor:pointer;transition:transform var(--t-fast),background var(--t-fast),border-color var(--t-fast),box-shadow var(--t-fast);
  text-decoration:none;line-height:1.2;min-height:44px}
.btn:hover{background:var(--bg-3);border-color:rgba(255,255,255,.2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--accent),#0ea5e9);color:var(--accent-ink);border-color:transparent;box-shadow:var(--sh-2)}
.btn.primary:hover{filter:brightness(1.06);background:linear-gradient(180deg,var(--accent),#0ea5e9)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;min-height:36px;font-size:.86rem;border-radius:var(--r-sm)}
.btn.lg{padding:14px 24px;font-size:1.05rem;min-height:52px}
.btn.icon{padding:0;width:44px;height:44px;min-height:44px}
.btn.block{display:flex;width:100%}
.btn.ok{border-color:rgba(52,211,153,.5)} .btn.bad{border-color:rgba(251,113,133,.5)}
.btn.selected{border-color:var(--accent);box-shadow:var(--glow)}

.chip{display:inline-flex;align-items:center;gap:.4em;padding:4px 11px;border-radius:var(--r-pill);
  font-size:.8rem;font-weight:600;border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip .dot{width:9px;height:9px;border-radius:50%;display:inline-block}

.tag{display:inline-flex;align-items:center;gap:.35em;padding:3px 9px;border-radius:6px;font-size:.74rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.tag.norte{background:var(--r-norte-d);color:var(--r-norte)} .tag.central{background:var(--r-central-d);color:var(--r-central)}
.tag.caribe{background:var(--r-caribe-d);color:var(--r-caribe)} .tag.sur{background:var(--r-sur-d);color:var(--r-sur)}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:60;height:var(--nav-h);display:flex;align-items:center;gap:12px;
  padding:0 14px;background:rgba(9,14,26,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-2)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;flex-shrink:0}
.brand .logo{width:34px;height:34px;flex-shrink:0}
.brand b{font-size:1.05rem}.brand span{color:var(--accent)}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;padding:8px 12px;border-radius:var(--r-sm);color:var(--text-dim);
  text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid transparent;transition:color var(--t-fast),background var(--t-fast)}
.nav a:hover{color:var(--text);background:var(--panel-2)}
.nav a[aria-current="page"]{color:var(--accent);background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.25)}
.topbar-actions{display:flex;gap:6px;flex-shrink:0}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-dim);cursor:pointer;transition:all var(--t-fast)}
.iconbtn:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.iconbtn.on{color:var(--accent);border-color:rgba(56,189,248,.4)}
.iconbtn svg{width:20px;height:20px}
.nav-toggle{display:none}

/* ---------- Layout ---------- */
main{min-height:calc(100vh - var(--nav-h))}
.view{padding:18px;max-width:1400px;margin:0 auto;animation:fadeUp var(--t) var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view-head{margin-bottom:16px}
.view-head .kick{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.view-head p{color:var(--text-dim);max-width:70ch}
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(2,1fr)} .cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)} .cols-auto{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
@media(max-width:900px){.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1)}
.panel.solid{background:var(--panel-solid)}
.card{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r-md);padding:14px;transition:border-color var(--t-fast),transform var(--t-fast)}
.card.hoverable{cursor:pointer}
.card.hoverable:hover{border-color:rgba(56,189,248,.4);transform:translateY(-2px)}
.muted{color:var(--text-mute)} .dim{color:var(--text-dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between} .row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}
.divider{height:1px;background:var(--border-2);margin:14px 0;border:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border-2)}
.kv:last-child{border-bottom:0} .kv .k{color:var(--text-mute);font-size:.9rem} .kv .v{font-weight:600;text-align:right}

/* ---------- Globo ---------- */
#stage{position:relative;border-radius:var(--r-lg);overflow:hidden;background:
  radial-gradient(90% 90% at 50% 30%,#0a1428 0%,#060a15 70%);border:1px solid var(--border);
  min-height:420px;display:flex;align-items:center;justify-content:center}
#globe-host{position:absolute;inset:0}
#globe-host canvas{display:block;outline:none}
.stage-badge{position:absolute;left:12px;top:12px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;max-width:70%}
.stage-controls{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;gap:6px}
.stage-legend{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(6,10,20,.7);
  border:1px solid var(--border);border-radius:var(--r-md);padding:9px 11px;backdrop-filter:blur(6px);font-size:.78rem;display:flex;flex-direction:column;gap:5px;max-width:190px}
.stage-legend .lg{display:flex;align-items:center;gap:7px} .stage-legend .sw{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.stage-hint{position:absolute;bottom:10px;right:12px;z-index:5;color:var(--text-mute);font-size:.72rem;
  background:rgba(6,10,20,.66);padding:5px 9px;border-radius:6px;border:1px solid var(--border-2);pointer-events:none;max-width:60%}
/* globe.gl inyecta su propio cartel de ayuda en inglés: lo reemplazamos por el nuestro */
#globe-host .scene-nav-info{display:none!important}
#globe-host .scene-tooltip{pointer-events:none}

/* ---------- Etiquetas sobre el globo (país + bandera · capital · líneas) ---------- */
#globe-host .g-chip{
  position:absolute; pointer-events:auto; cursor:pointer; user-select:none;
  font-family:var(--font); font-weight:700; line-height:1.1; white-space:nowrap;
  transition:opacity .18s var(--ease), filter .18s var(--ease);
}
#globe-host .g-chip.off,#globe-host .g-chip.behind,#globe-host .g-chip.clash{opacity:0;pointer-events:none}
/* País: bandera mínima + nombre */
#globe-host .g-pais{
  display:flex; align-items:center; gap:4px; padding:2px 7px 2px 3px;
  background:rgba(6,12,24,.72); border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r-pill); box-shadow:0 2px 10px rgba(0,0,0,.55);
  backdrop-filter:blur(3px); font-size:.68rem; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.9);
}
#globe-host .g-pais img{width:15px;height:11px;object-fit:cover;border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.35);flex:0 0 auto;display:block}
#globe-host .g-pais.noflag img{display:none}
#globe-host .g-pais .cp{display:none;font-weight:600;color:#ffd166;font-size:.68rem;
  border-left:1px solid rgba(255,255,255,.22);padding-left:6px;margin-left:2px}
#globe-host .g-pais.on{
  background:rgba(6,12,24,.94); border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(56,189,248,.55),0 6px 18px rgba(0,0,0,.6);
  font-size:.8rem; z-index:3;
}
#globe-host .g-pais.on .cp{display:inline}
#globe-host .g-pais.on.caps .cp{display:none}
#globe-host .g-pais.sel{border-color:#fff}
#globe-host .g-pais.prio-1{font-size:.72rem}
#globe-host .g-pais.r-norte{border-left:3px solid var(--r-norte)}
#globe-host .g-pais.r-central{border-left:3px solid var(--r-central)}
#globe-host .g-pais.r-caribe{border-left:3px solid var(--r-caribe)}
#globe-host .g-pais.r-sur{border-left:3px solid var(--r-sur)}
/* Capital: chincheta anclada al punto exacto + nombre al costado */
#globe-host .g-cap{width:0;height:0;overflow:visible;font-size:.66rem}
#globe-host .g-cap .nm{position:absolute;left:7px;top:-7px;color:#ffe6a8;font-weight:700;white-space:nowrap;
  text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.95);letter-spacing:.01em}
#globe-host .g-cap.on .nm{color:#08121f;background:#ffd166;padding:2px 8px;border-radius:var(--r-pill);
  box-shadow:0 2px 10px rgba(0,0,0,.6);top:-10px;font-size:.72rem;text-shadow:none}
/* Líneas notables (Ecuador, trópicos, Greenwich…) */
#globe-host .g-grid{
  padding:2px 8px;border-radius:var(--r-sm);font-size:.66rem;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:#bfe6ff;background:rgba(6,16,32,.6);
  border:1px solid rgba(125,211,252,.35);pointer-events:none;text-shadow:0 1px 2px #000;
}
/* Tooltip del globo */
.globe-tip{font-family:var(--font);background:rgba(6,12,24,.94);border:1px solid rgba(255,255,255,.22);
  border-radius:var(--r-sm);padding:6px 10px;color:#eef2fb;box-shadow:var(--sh-2);display:flex;
  flex-direction:column;gap:2px;font-size:.82rem}
.globe-tip b{font-size:.92rem}
.globe-tip span{color:#ffd166;font-size:.76rem;font-weight:600}
@media(max-width:620px){
  #globe-host .g-pais{font-size:.62rem;padding:1px 6px 1px 2px;gap:3px}
  #globe-host .g-pais.prio-1{font-size:.65rem}
  #globe-host .g-pais img{width:13px;height:9px}
  #globe-host .g-cap{font-size:.6rem}
  #stage .stage-hint{display:none}
  #stage .stage-legend{font-size:.7rem;padding:6px 8px;gap:3px;max-width:150px;left:8px;bottom:8px}
}
html[data-contrast="high"] #globe-host .g-pais{background:#000;border-color:#fff;color:#fff}
html[data-contrast="high"] #globe-host .g-cap .nm{background:#000;padding:1px 5px;border-radius:4px}
html[data-motion="reduced"] #globe-host .g-chip{transition:none}

/* Explorar layout */
.explore-grid{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.explore-grid #stage{min-height:min(72vh,720px)}
@media(max-width:1000px){.explore-grid{grid-template-columns:1fr}.explore-grid #stage{min-height:52vh}}

/* Ficha de país */
.ficha{position:sticky;top:calc(var(--nav-h) + 12px)}
.ficha .flag{width:100%;max-width:120px;height:auto;border-radius:6px;border:1px solid var(--border);box-shadow:var(--sh-1)}
.ficha .silhouette{width:100%;height:120px}
.ficha-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--text-mute);padding:40px 16px}

/* Buscador */
.searchbox{position:relative}
.searchbox input{width:100%}
.autocomplete{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);background:var(--panel-solid);
  border:1px solid var(--border);border-radius:var(--r-md);max-height:280px;overflow:auto;box-shadow:var(--sh-3)}
.autocomplete button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;background:transparent;border:0;
  border-bottom:1px solid var(--border-2);color:var(--text);cursor:pointer;text-align:left}
.autocomplete button:hover,.autocomplete button.active{background:var(--panel-2)}
.autocomplete img{width:26px;height:18px;border-radius:3px;object-fit:cover}

/* Inputs */
input[type=text],input[type=search],input[type=number],select,textarea{
  width:auto;background:var(--bg-1);border:1px solid var(--border);color:var(--text);
  padding:11px 13px;border-radius:var(--r-md);font-size:1rem;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:.88rem;color:var(--text-dim);font-weight:600;display:block;margin-bottom:5px}
.field{margin-bottom:12px}
.seg{display:inline-flex;background:var(--bg-1);border:1px solid var(--border);border-radius:var(--r-md);padding:3px;gap:3px;flex-wrap:wrap}

/* ---------- Panel de capas del globo ---------- */
.layers-panel{margin-top:12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-1)}
.layers-panel>summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:.9rem;
  display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:var(--r-md);list-style:none}
.layers-panel>summary::-webkit-details-marker{display:none}
.layers-panel>summary::after{content:'▾';color:var(--accent);transition:transform var(--t)}
.layers-panel[open]>summary::after{transform:rotate(180deg)}
.layers-panel>summary small{color:var(--text-mute);font-weight:500;font-size:.74rem}
.layers-panel>summary:hover{background:var(--bg-2)}
.layers-body{padding:4px 12px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.layers-row{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--border-2);
  border-radius:var(--r-sm);background:var(--bg-2)}
.layers-row>label:first-child{display:flex;justify-content:space-between;font-weight:700;font-size:.85rem}
.layers-row small{font-size:.72rem;line-height:1.35}
.layers-row select{width:100%}
.layers-val{color:var(--accent);font-variant-numeric:tabular-nums}
.layers-row input[type=range]{width:100%;accent-color:var(--accent)}
.layers-row .switch{justify-content:flex-start;gap:10px;font-size:.85rem;font-weight:700}
.seg button{border:0;background:transparent;color:var(--text-dim);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:44px;height:26px;border-radius:20px;background:var(--bg-3);border:1px solid var(--border);position:relative;transition:background var(--t-fast)}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-dim);transition:transform var(--t-fast),background var(--t-fast)}
.switch input:checked+.track{background:rgba(56,189,248,.4)}
.switch input:checked+.track::after{transform:translateX(18px);background:var(--accent)}
.switch input:focus-visible+.track{outline:3px solid var(--focus);outline-offset:2px}

/* Barras / métricas */
.bar{height:10px;border-radius:20px;background:var(--bg-1);overflow:hidden;border:1px solid var(--border-2)}
.bar>span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width var(--t-slow) var(--ease)}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .n{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric .l{color:var(--text-mute);font-size:.82rem;font-weight:600}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}

/* Quiz */
.quiz-wrap{max-width:760px;margin:0 auto}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.quiz-progress{flex:1;min-width:160px}
.quiz-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem}
.quiz-timer.low{color:var(--bad)}
.quiz-q{font-size:clamp(1.2rem,3vw,1.6rem);font-weight:700;margin:6px 0 18px;line-height:1.3}
.options{display:grid;gap:11px;grid-template-columns:1fr 1fr}
@media(max-width:600px){.options{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:var(--r-md);border:1px solid var(--border);
  background:var(--panel-2);color:var(--text);cursor:pointer;font-size:1.02rem;font-weight:600;text-align:left;transition:all var(--t-fast);min-height:56px}
.opt:hover:not(:disabled){border-color:rgba(56,189,248,.5);background:var(--bg-3)}
.opt .key{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border-radius:7px;background:var(--bg-1);border:1px solid var(--border);font-size:.85rem;font-weight:800;color:var(--text-mute)}
.opt.correct{border-color:var(--ok);background:var(--ok-d)} .opt.correct .key{background:var(--ok);color:#04241a;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:var(--bad-d)} .opt.wrong .key{background:var(--bad);color:#2a0710;border-color:transparent}
.opt.flag img{width:56px;height:38px;border-radius:5px;object-fit:cover;border:1px solid var(--border)}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--border);animation:fadeUp var(--t)}
.feedback.ok{background:var(--ok-d);border-color:rgba(52,211,153,.4)}
.feedback.bad{background:var(--bad-d);border-color:rgba(251,113,133,.4)}
.feedback h4{margin:0 0 4px} .feedback .note{color:var(--text-dim);font-size:.9rem}

/* Tarjeta 3D flip */
.flashcard{perspective:1400px;max-width:460px;margin:0 auto}
.flashcard .inner{position:relative;width:100%;min-height:340px;transform-style:preserve-3d;transition:transform var(--t-slow) var(--ease);cursor:pointer}
.flashcard.flipped .inner{transform:rotateY(180deg)}
.flashcard .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:26px;border-radius:var(--r-xl);
  border:1px solid var(--border);background:var(--panel-solid);text-align:center;box-shadow:var(--sh-2)}
.flashcard .back{transform:rotateY(180deg);background:linear-gradient(180deg,var(--bg-3),var(--panel-solid))}
.flashcard .face .flag{width:130px;border-radius:8px;border:1px solid var(--border)}
html[data-motion="reduced"] .flashcard .inner{transition:none}
html[data-motion="reduced"] .flashcard.flipped .inner{transform:none}
html[data-motion="reduced"] .flashcard.flipped .face:not(.back){display:none}
html[data-motion="reduced"] .flashcard.flipped .back{transform:none}
html[data-motion="reduced"] .flashcard:not(.flipped) .back{display:none}

/* Insignias / logros */
.badge{display:flex;gap:11px;align-items:center;padding:12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel-2)}
.badge.locked{opacity:.5;filter:grayscale(.7)}
.badge .ico{width:44px;height:44px;flex-shrink:0;border-radius:11px;display:grid;place-items:center;background:var(--r-caribe-d);color:var(--r-caribe)}
.badge .ico svg{width:24px;height:24px}
.badge b{display:block;font-size:.94rem}.badge small{color:var(--text-mute)}

/* Matriz de dominio */
.mastery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mcell{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);font-size:.82rem}
.mcell .lvl{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.mcell .pat{width:16px;height:16px;flex-shrink:0}

/* Territorios / tabla */
table.data{width:100%;border-collapse:collapse;font-size:.9rem}
table.data th,table.data td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--border-2)}
table.data th{color:var(--text-mute);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--panel-solid)}
table.data tr:hover td{background:var(--panel-2)}
table.data td .flag{width:26px;height:18px;border-radius:3px;object-fit:cover;vertical-align:middle}

/* Toast / live */
#toast-root{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,360px)}
.toast{background:var(--panel-solid);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh-3);animation:toastIn var(--t) var(--ease);display:flex;gap:10px;align-items:flex-start}
.toast.ok{border-left-color:var(--ok)} .toast.bad{border-left-color:var(--bad)} .toast.warn{border-left-color:var(--warn)}
.toast b{display:block} .toast small{color:var(--text-dim)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(4,7,14,.66);backdrop-filter:blur(4px)}
#modal-root.open{display:flex;animation:fadeUp var(--t)}
.modal{background:var(--panel-solid);border:1px solid var(--border);border-radius:var(--r-xl);
  max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--sh-3);padding:22px}
.modal-x{position:absolute;top:14px;right:14px}

/* Loading */
#app-loading{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg-0)}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{color:var(--text-dim);font-weight:600}

/* Portada / hero */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--border);
  min-height:min(78vh,700px);display:grid;grid-template-columns:1.05fr .95fr;
  background:radial-gradient(120% 120% at 80% 10%,#0b1730,#060a15 70%)}
.hero #stage{border:0;border-radius:0;min-height:100%}
.hero-copy{padding:clamp(20px,4vw,46px);display:flex;flex-direction:column;justify-content:center;gap:16px;position:relative;z-index:4}
.hero-copy .kick{color:var(--accent);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:.8rem}
.hero-copy h1{font-size:clamp(2rem,5vw,3.4rem);margin:0}
.hero-copy .lede{font-size:clamp(1.02rem,1.6vw,1.2rem);color:var(--text-dim);max-width:42ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px}
.hero-stats .metric .n{font-size:1.5rem}
@media(max-width:920px){.hero{grid-template-columns:1fr;min-height:auto}.hero #stage{min-height:44vh;order:-1}}

/* Pulso capital */
@keyframes pulseRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* Confetti / celebración */
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:130;overflow:hidden}
.confetti{position:absolute;width:9px;height:14px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* Mapa 2D SVG */
.map2d{width:100%;height:auto;background:radial-gradient(90% 90% at 50% 40%,#0a1428,#060a15);border-radius:var(--r-lg);border:1px solid var(--border);touch-action:manipulation}
.map2d path.country{fill:var(--bg-3);stroke:rgba(255,255,255,.22);stroke-width:.5;cursor:pointer;transition:fill var(--t-fast)}
.map2d path.country.norte{fill:var(--r-norte-d)} .map2d path.country.central{fill:var(--r-central-d)}
.map2d path.country.caribe{fill:var(--r-caribe-d)} .map2d path.country.sur{fill:var(--r-sur-d)}
.map2d path.country:hover{stroke:var(--accent);stroke-width:1}
.map2d path.country.sel{fill:var(--accent);stroke:#fff;stroke-width:1.2}
.map2d circle.cap{fill:var(--warn);stroke:#3a2c05;stroke-width:.4}
.map2d text.lbl{fill:var(--text);font-size:6px;paint-order:stroke;stroke:#060a15;stroke-width:1.6px;font-weight:600;pointer-events:none}

/* progreso donut */
.donut{--v:0;width:120px;height:120px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--v)*1%),var(--bg-1) 0);
  display:grid;place-items:center;position:relative}
.donut::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--panel-solid)}
.donut .val{position:relative;font-weight:800;font-size:1.3rem}

.empty-state{text-align:center;color:var(--text-mute);padding:44px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-state svg{width:54px;height:54px;opacity:.5}

.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.list-clean{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}

kbd{font-family:var(--mono);background:var(--bg-1);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:.82rem}

/* Responsive nav */
@media(max-width:860px){
  .nav{position:fixed;top:var(--nav-h);left:0;right:0;flex-direction:column;background:rgba(9,14,26,.98);
    padding:8px;gap:4px;border-bottom:1px solid var(--border);transform:translateY(-120%);transition:transform var(--t);max-height:calc(100vh - var(--nav-h));overflow:auto;z-index:59}
  .nav.open{transform:none}
  .nav a{font-size:1rem;padding:12px}
  .nav-toggle{display:grid}
}
@media(max-width:520px){
  .view{padding:12px}
  .brand b{display:none}
  .hero-copy{padding:20px}
}
</style>

  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='html') n.innerHTML=v;

    else if(k==='dataset') Object.assign(n.dataset,v);
    else if(k.startsWith('on')&&typeof v==='function') n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k in n && k!=='list') { try{n[k]=v;}catch{ n.setAttribute(k,v);} }
    else n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;
}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function norm(s){return (s||'').toString().toLowerCase().normalize('NFD')
  .replace(/[̀-ͯ]/g,'').replace(/["'`´.,]/g,'').replace(/[-_/]/g,' ')
  .replace(/\s+/g,' ').trim();}
function answerMatches(input, accepted){
  const ni=norm(input); if(!ni) return false;
  const nis=ni.replace(/\s/g,'');
  return accepted.some(a=>{const na=norm(a);const nas=na.replace(/\s/g,'');

/* ============================================================
   Store — persistencia local (localStorage)
   ============================================================ */
const Store=(function(){
  const KEY='atlas3d.v1';
  const DEFAULT_CONFIG={region:'todas',level:'principiante',sound:false,volume:.6,
    motion:'auto',contrast:'normal',textsize:0,quality:'auto',view:'relieve',
    labels:true,capitals:true,rotate:true,
    // globo: relieve, retícula y capas
    relieve:60,meridianos:true,meridianosPaso:15,lineasClave:true,mundo:true,banderas:true};
  let state;
  function fresh(){return{version:1,config:{...DEFAULT_CONFIG},progress:{},
    stats:{points:0,bestStreak:0,studySeconds:0,answered:0,correct:0},
    evals:[],achievements:{},daily:{}};}
  function load(){
    try{const raw=localStorage.getItem(KEY);
      if(!raw){state=fresh();return;}
      const p=JSON.parse(raw); state=Object.assign(fresh(),p);
      state.config=Object.assign({...DEFAULT_CONFIG},p.config||{});
      // migración v1 -> v2: el globo pasa a tener relieve y retícula por defecto
      if(p.config&&p.config.relieve===undefined){
        state.config.relieve=DEFAULT_CONFIG.relieve;
        if(state.config.view==='educativa')state.config.view=DEFAULT_CONFIG.view;
      }
    }catch(e){console.warn('Store: no se pudo leer, se reinicia.',e);state=fresh();}
  }
  let saveT=null;
  function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(state));}
    catch(e){console.warn('Store: no se pudo guardar.',e);UI&&UI.toast('No se pudo guardar el progreso','warn');}
  },160);}
  function get(){return state;}
  function cfg(){return state.config;}
  function setCfg(k,v){state.config[k]=v;save();}
  function prog(id){ if(!state.progress[id]) state.progress[id]={seen:0,correct:0,wrong:0,streak:0,box:0,ease:2.3,avgMs:0,lastMs:0,last:0,due:0,dificil:false}; return state.progress[id]; }
  function exportJSON(){return JSON.stringify(state,null,2);}
  function importJSON(text){
    const p=JSON.parse(text);
    if(!p||typeof p!=='object'||!('progress'in p)) throw new Error('Estructura no válida');
    state=Object.assign(fresh(),p);
    state.config=Object.assign({...DEFAULT_CONFIG},p.config||{});
    save();return true;
  }
  function reset(){state=fresh();save();}
  load();
  return {get,cfg,setCfg,prog,save,exportJSON,importJSON,reset,DEFAULT_CONFIG};
})();

/* ============================================================
   SR — dominio por país y repetición espaciada (Leitner simple)
   ============================================================ */
const MASTERY={
  nuevo:{id:'nuevo',label:'Nuevo',color:'var(--m-nuevo)',pat:'○'},
  aprendiendo:{id:'aprendiendo',label:'En aprendizaje',color:'var(--m-aprendiendo)',pat:'◔'},
  practica:{id:'practica',label:'En práctica',color:'var(--m-practica)',pat:'◑'},
  casi:{id:'casi',label:'Casi dominado',color:'var(--m-casi)',pat:'◕'},
  dominado:{id:'dominado',label:'Dominado',color:'var(--m-dominado)',pat:'●'},
  repaso:{id:'repaso',label:'Necesita repaso',color:'var(--m-repaso)',pat:'⟳'},
};
const SR=(function(){
  const DAY=86400000;
  const INTERVAL=[0,1,2,4,8,16,32]; // días por caja (box 0..6)
  function level(id){
    const p=Store.prog(id);
    if(p.seen===0) return 'nuevo';
    if(p.due&&Date.now()>p.due&&p.box>=2) return 'repaso';
    if(p.dificil&&p.box<=1) return 'repaso';
    return ['aprendiendo','aprendiendo','practica','practica','casi','dominado','dominado'][clamp(p.box,0,6)];
  }
  function record(id,correct,ms,grade){
    const p=Store.prog(id);
    p.seen++; if(ms>0){p.lastMs=ms;p.avgMs=p.avgMs?Math.round(p.avgMs*.7+ms*.3):ms;}
    p.last=Date.now();
    // grade: 'facil' | 'dudo' | 'nose' (tarjetas) — opcional
    if(grade==='nose'){correct=false;}
    if(correct){
      p.correct++; p.streak=(p.streak||0)+1;
      const step=(grade==='dudo')?0:1;
      p.box=clamp((p.box||0)+step,0,6);
      if(p.box>=3) p.dificil=false;
    }else{
      p.wrong++; p.streak=0; p.box=clamp((p.box||0)-2,0,6); p.dificil=true;
    }
    p.due=Date.now()+INTERVAL[clamp(p.box,0,6)]*DAY;
    Store.save();
    return level(id);
  }
  function weight(id){
    const p=Store.prog(id), lv=level(id);
    let w=1;
    if(lv==='nuevo') w=2;
    else if(lv==='repaso') w=4;
    else if(lv==='aprendiendo') w=3;
    else if(lv==='practica') w=1.6;
    else if(lv==='casi') w=1;
    else if(lv==='dominado') w=.4; // no se ocultan, solo bajan de frecuencia
    if(p.dificil) w+=2;
    return w;
  }
  function weightedPick(pool,n){
    pool=pool.slice(); const out=[];
    n=Math.min(n,pool.length);
    for(let k=0;k<n;k++){
      const ws=pool.map(c=>weight(c.id)); const tot=ws.reduce((a,b)=>a+b,0);
      let r=Math.random()*tot,i=0; while(r>ws[i]&&i<ws.length-1){r-=ws[i++];}
      out.push(pool.splice(i,1)[0]);
    }
    return out;

/* ============================================================
   Audio — Web Audio (tonos) + Web Speech (pronunciación)
   ============================================================ */
const Audio=(function(){
  let ctx=null;
  function ac(){if(!ctx&&window.AudioContext){try{ctx=new AudioContext();}catch{}}return ctx;}
  function on(){return Store.cfg().sound;}
  function vol(){return clamp(Store.cfg().volume,0,1);}
  function tone(freq,dur,type='sine',t0=0,gain=1){
    const c=ac(); if(!c) return;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.value=freq;
    const t=c.currentTime+t0;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol()*gain*.5,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02);
  }
  function play(kind){
    if(!on()) return; const c=ac(); if(!c) return; if(c.state==='suspended')c.resume();
    if(kind==='ok'){tone(660,.12,'sine',0,.9);tone(880,.16,'sine',.09,.8);}
    else if(kind==='bad'){tone(220,.18,'sine',0,.7);tone(180,.22,'sine',.06,.6);}
    else if(kind==='badge'){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.09,.7));}
    else if(kind==='click'){tone(440,.05,'square',0,.3);}
    else if(kind==='win'){[523,587,659,784,880,1047].forEach((f,i)=>tone(f,.22,'sine',i*.1,.7));}
  }
  let voices=[];
  function loadVoices(){voices=(window.speechSynthesis&&speechSynthesis.getVoices())||[];}
  if(window.speechSynthesis){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
  function speak(text){
    if(!on()||!window.speechSynthesis) return;
    try{speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      const v=voices.find(x=>/es[-_]/i.test(x.lang))||voices.find(x=>/^es/i.test(x.lang));
      if(v)u.voice=v; u.lang=(v&&v.lang)||'es-ES'; u.rate=.95; u.volume=vol();
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function resume(){const c=ac();if(c&&c.state==='suspended')c.resume();}
  return {play,speak,resume};
})();

const UI=(function(){
  const liveEl=()=>$('#live'), liveA=()=>$('#live-assert');
  function announce(msg,assertive){const n=assertive?liveA():liveEl();if(n){n.textContent='';setTimeout(()=>n.textContent=msg,30);}}

    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),300);},type==='bad'?4200:3200);
  }

  function modal(contentNode,{title,onClose}={}){
    const root=$('#modal-root'); root.innerHTML='';

    const box=el('div',{class:'modal'});
    if(title){const h=el('h3',{id:'modal-title',text:title});box.appendChild(h);root.setAttribute('aria-labelledby','modal-title');}
    const x=el('button',{class:'iconbtn modal-x','aria-label':'Cerrar',onclick:close,html:svgIcon(ICON.x)});
    box.appendChild(x); box.appendChild(contentNode); root.appendChild(box);
    root.classList.add('open');
    function onKey(e){if(e.key==='Escape')close(); if(e.key==='Tab')trapTab(e,box);}
    root.__key=onKey; document.addEventListener('keydown',onKey);
    root.onclick=e=>{if(e.target===root)close();};
    setTimeout(()=>{(box.querySelector('[autofocus],button,input,select,textarea')||box).focus();},30);
    function close(){root.classList.remove('open');root.innerHTML='';document.removeEventListener('keydown',onKey);if(onClose)onClose();if(lastFocus)try{lastFocus.focus();}catch{}}
    root.__close=close; return {close};
  }
  function trapTab(e,box){
    const f=box.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!f.length)return; const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
  function confirm(msg,{title='Confirmar',okText='Aceptar',danger=false}={}){
    return new Promise(res=>{
      let done=false;
      const responder=v=>{if(done)return;done=true;res(v);};
      const body=el('div',{},el('p',{class:'dim',text:msg}),
        el('div',{class:'row end',style:'margin-top:16px'},
          el('button',{class:'btn ghost',text:'Cancelar',onclick:()=>{m.close();responder(false);}}),
          el('button',{class:'btn '+(danger?'':'primary'),text:okText,style:danger?'border-color:var(--bad);color:var(--bad)':'',onclick:()=>{m.close();responder(true);}})));
      // cerrar con Escape, clic fuera o la X equivale a cancelar
      const m=modal(body,{title,onClose:()=>responder(false)});

  }

    if(Store.cfg().motion==='reduced'||document.documentElement.dataset.motion==='reduced')return;
    const wrap=el('div',{class:'celebrate','aria-hidden':'true'}); document.body.appendChild(wrap);
    const cols=['#38bdf8','#37d6b3','#ffb454','#c58bfa','#34d399','#fb7185'];

      c.style.animationDuration=(1.6+Math.random()*1.8)+'s'; c.style.animationDelay=(Math.random()*.4)+'s';
      c.style.top='-20px'; wrap.appendChild(c);
    }
    setTimeout(()=>wrap.remove(),3600);
  }
  return {announce,toast,modal,confirm,celebrate};
})();

/* ============================================================
   Router — SPA por hash (#/seccion) + subruta opcional
   ============================================================ */
const Router=(function(){
  const routes={};
  let current=null;
  function on(name,render){routes[name]=render;}
  function parse(){
    let h=location.hash.replace(/^#\/?/,''); if(!h)h='inicio';
    const [name,...rest]=h.split('/'); return {name,arg:rest.join('/')};
  }
  function go(path){location.hash='#/'+path;}
  function render(){
    const {name,arg}=parse();
    const r=routes[name]?name:'inicio';
    current=r;
    const root=$('#view-root');
    Globe && Globe.detach && Globe.detach(); // por defecto, ocultar globo salvo que la vista lo pida
    root.innerHTML='';
    try{ routes[r](root,arg); }
    catch(e){ console.error('Error render '+r,e); root.appendChild(el('div',{class:'empty-state'},el('p',{text:'Ocurrió un error al mostrar esta sección.'}),el('pre',{class:'muted',style:'font-size:.8rem;white-space:pre-wrap',text:String(e&&e.message||e)}))); }
    // nav aria-current
    $$('#nav a').forEach(a=>{const rn=a.getAttribute('href').replace(/^#\/?/,'').split('/')[0];
      if(rn===r)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');});
    $('#nav').classList.remove('open'); $('#navToggle').setAttribute('aria-expanded','false');
    const main=$('#view-root'); main.focus({preventScroll:true}); window.scrollTo({top:0,behavior:(document.documentElement.dataset.motion==='reduced')?'auto':'smooth'});
    UI.announce('Sección: '+(NAV.find(x=>x.id===r)?.label||r));
  }
  function start(){window.addEventListener('hashchange',render);render();}
  return {on,go,start,parse,get current(){return current;}};
})();

/* ============================================================
   A11y — aplica preferencias y cablea controles globales
   ============================================================ */
const A11y=(function(){
  const mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false,addEventListener(){}};
  function reducedMotion(){const m=Store.cfg().motion;return m==='reduced'||(m==='auto'&&mq.matches);}
  function apply(){
    const c=Store.cfg(), html=document.documentElement;
    html.dataset.motion=reducedMotion()?'reduced':'full';
    html.dataset.contrast=c.contrast==='high'?'high':'normal';
    html.dataset.textsize=String(c.textsize||0);
    const sb=$('#btnSound'); if(sb){sb.setAttribute('aria-pressed',String(!!c.sound));sb.classList.toggle('on',!!c.sound);sb.setAttribute('aria-label',c.sound?'Silenciar sonido':'Activar sonido');}
    if(window.Globe&&Globe.applyPrefs) Globe.applyPrefs();
  }
  function wire(){
    $('#btnSound').addEventListener('click',()=>{
      const v=!Store.cfg().sound; Store.setCfg('sound',v); apply();
      if(v){Audio.resume();Audio.play('click');UI.toast('Sonido activado','info','Pronunciación y efectos disponibles');}
      else UI.toast('Sonido silenciado','info');
    });
    $('#btnA11y').addEventListener('click',()=>Router.go('config'));
    $('#navToggle').addEventListener('click',()=>{
      const nav=$('#nav'),b=$('#navToggle'),open=nav.classList.toggle('open');
      b.setAttribute('aria-expanded',String(open));
    });
    mq.addEventListener&&mq.addEventListener('change',apply);
    document.addEventListener('visibilitychange',()=>{if(window.Globe&&Globe.setVisible)Globe.setVisible(!document.hidden);});
  }
  return {apply,wire,reducedMotion};
})();

  /* ---------- Etiquetas HTML: país + bandera · capital · líneas clave ---------- */
  function chipData(){
    const out=[];
    COUNTRIES.forEach(c=>{
      out.push({type:'pais',id:c.id,lat:c.coordenadasPais.lat,lng:c.coordenadasPais.lng,
        name:c.nombreES,cap:c.capitalPrincipal,flag:c.bandera,prio:LABEL_PRIO[c.id]||2,reg:c.regionPedagogica});
      out.push({type:'capital',id:c.id,lat:c.coordenadasCapital.lat,lng:c.coordenadasCapital.lng,
        name:c.capitalPrincipal,pais:c.nombreES,reg:c.regionPedagogica,prio:LABEL_PRIO[c.id]||2});
    });
    GRID_NAMED.forEach(g=>out.push({type:'grid',id:'g-'+g.kind+g.deg,kind:g.kind,deg:g.deg,
      lat:g.kind==='p'?g.deg:2, lng:g.kind==='p'?-52:g.deg, name:g.short, full:g.name}));
    return out;
  }
  function chipNode(d){
    const n=document.createElement('div');
    d.__el=n;
    if(d.type==='grid'){
      n.className='g-chip g-grid'; n.textContent=d.name; n.title=d.full; d.__box=n;
      return n;
    }
    if(d.type==='capital'){
      n.className='g-chip g-cap r-'+d.reg;
      n.appendChild(el('span',{class:'nm',text:'★ '+d.name}));
      n.title='Capital de '+d.pais+': '+d.name;
      d.__box=n.querySelector('.nm');
    }else{
      n.className='g-chip g-pais prio-'+d.prio+' r-'+d.reg;
      n.appendChild(el('img',{alt:'',src:d.flag,loading:'lazy',
        onerror:function(){this.style.display='none';}}));
      n.appendChild(el('span',{class:'nm',text:d.name}));
      n.appendChild(el('span',{class:'cp',text:'★ '+d.cap}));
      n.title=d.name+' — capital: '+d.cap;
      d.__box=n;
    }
    n.addEventListener('pointerenter',()=>setHover(d.id));
    n.addEventListener('pointerleave',()=>setHover(null));
    n.addEventListener('click',ev=>{ev.stopPropagation();const c=byId(d.id);
      if(c){selectCountry(c,true);if(opts.onSelect)opts.onSelect(c);}});
    return n;
  }
  function chipVisible(d){
    if(d.type==='grid')return !!(opts.grid&&opts.gridNamed);
    const on=(d.id===selectedId||d.id===hoverId);
    if(d.type==='capital'){
      if(!opts.capitals)return false;
      return on||camAlt<=2.25;
    }
    if(!opts.labels)return on;
    return on||camAlt<=(PRIO_ALT[d.prio]||2.2);
  }
  function refreshChips(){
    chips.forEach(d=>{const n=d.__el; if(!n)return;
      n.classList.toggle('off',!chipVisible(d));
      n.classList.toggle('on',d.id===selectedId||d.id===hoverId);
      n.classList.toggle('sel',d.id===selectedId);
      n.classList.toggle('noflag',!opts.flags);
      if(d.type==='pais')n.classList.toggle('caps',!!opts.capitals);
    });
    queueDeclutter();
  }
  /* Anticolisión: si dos etiquetas se pisan en pantalla, gana la de mayor prioridad.
     Así los nombres se leen siempre, sin amontonarse. */
  function rank(d){
    if(d.id===selectedId)return 0;
    if(d.id===hoverId)return 1;
    if(d.type==='grid')return 46;
    if(d.type==='capital')return (byId(d.id)&&(d.id===selectedId||d.id===hoverId))?4:40;
    return 8+(d.prio||2)*10;
  }
  function queueDeclutter(){
    const ahora=(window.performance&&performance.now())?performance.now():Date.now();
    if(ahora-declutterT>200){
      declutterT=ahora;
      if(declutterRAF)return;
      declutterRAF=requestAnimationFrame(()=>{declutterRAF=0;declutter();});
      return;
    }
    if(declutterTimer)return;
    declutterTimer=setTimeout(()=>{declutterTimer=0;declutterT=(window.performance&&performance.now())?performance.now():Date.now();declutter();},200);
  }
  function declutter(){
    if(!host||host.style.display==='none')return;
    const vis=chips.filter(d=>d.__el&&d.__box&&!d.__el.classList.contains('off')&&!d.__el.classList.contains('behind'));
    vis.sort((a,b)=>rank(a)-rank(b));
    const kept=[];
    for(const d of vis){
      const n=d.__el;
      n.classList.remove('clash');
      const r=d.__box.getBoundingClientRect();
      if(!r.width||!r.height)continue;
      const box={l:r.left-2,t:r.top-2,r:r.right+2,b:r.bottom+2};
      const choca=kept.some(k=>box.l<k.r&&box.r>k.l&&box.t<k.b&&box.b>k.t);
      if(choca&&rank(d)>1)n.classList.add('clash');
      else kept.push(box);
    }
  }
  /* Los rótulos de paralelos siguen a la cámara para quedar siempre legibles */
  function moverEtiquetasDeLinea(){
    if(!world)return;
    let hay=false;
    chips.forEach(d=>{if(d.type==='grid'&&d.kind==='p'){d.lng=camLng-22;hay=true;}});
    if(hay)world.htmlElementsData(chips);
  }
  function setHover(id){
    if(hoverId===id)return;
    hoverId=id;
    if(world)world.polygonCapColor(capColor);
    refreshChips();
  }

  /* ---------- Material del globo (texturas / relieve) ---------- */
  /* three-globe pone material.color = null al cargar una textura, así que no se puede
     asumir que las propiedades de color existan. Se reutiliza la clase Color de otra
     propiedad viva del material (three.js no está expuesto como global). */
  let ColorCls=null;
  function colorSet(gm,prop,hex){
    const c=gm[prop];
    if(c&&typeof c.set==='function'){c.set(hex);return;}
    if(!ColorCls){
      const ref=gm.color||gm.emissive||gm.specular;
      if(ref&&typeof ref.constructor==='function')ColorCls=ref.constructor;
    }
    if(ColorCls){try{gm[prop]=new ColorCls(hex);}catch(e){}}
  }
  /* Verifica una sola vez que la textura exista; si falta, avisa y cae a "Educativa" */
  function verificarTextura(url){
    if(TEX_STATE[url]!==undefined)return TEX_STATE[url];
    TEX_STATE[url]='cargando';
    const im=new Image();
    im.onload=()=>{TEX_STATE[url]=true;};
    im.onerror=()=>{TEX_STATE[url]=false;
      console.warn('Globo: falta la textura',url);
      if(UI&&UI.toast)UI.toast('Falta una textura del globo','warn','Se cambió al estilo Educativa. Revisá assets/textures/ (ver README).');
      setView('educativa');
      if(Store&&Store.setCfg)Store.setCfg('view','educativa');};
    im.src=url;
    return 'cargando';
  }
  function applyTexture(){
    if(!world)return;
    const s=style();
    try{
      if(s.img)verificarTextura(GLOBE_TEX[s.img]);
      world.globeImageUrl(s.img?GLOBE_TEX[s.img]:null);
      world.bumpImageUrl((s.bump&&opts.relief>0)?GLOBE_TEX.topo:null);
    }catch(e){console.warn('Globo: no se pudieron cargar las texturas',e);}
    try{
      const gm=world.globeMaterial();
      if(s.img){
        colorSet(gm,'color','#ffffff');      // blanco = sin teñir la textura
        colorSet(gm,'emissive','#000000');
        if('emissiveIntensity'in gm)gm.emissiveIntensity=0;
        gm.shininess=s.water?16:2;
        colorSet(gm,'specular',s.water?'#24435f':'#000000');
      }else{
        colorSet(gm,'color',s.ocean||'#0b1b3a');
        colorSet(gm,'emissive','#04203a');
        if('emissiveIntensity'in gm)gm.emissiveIntensity=.35;
        gm.shininess=6;
        colorSet(gm,'specular','#0a2036');
      }
      if('bumpScale'in gm)gm.bumpScale=(s.bump?1:0)*(opts.relief||0)/100*10;
      gm.needsUpdate=true;
      aplicarEspecular(gm,!!s.water);
    }catch(e){console.warn('Globo: no se pudo ajustar el material',e);}
    applyLights();
  }
  /* La luz principal sigue a la cámara (con un desfase) para que el hemisferio
     visible siempre esté iluminado y el relieve mantenga sombras. */
  function wireLight(){
    try{
      const ls=world.lights&&world.lights(); if(!ls)return;
      dirLight=ls.find(l=>l.isDirectionalLight)||null;
      if(!dirLight)return;
      const cam=world.camera();
      updLight=()=>{
        if(!dirLight||!cam)return;
        const p=cam.position, a=.5, r=Math.hypot(p.x,p.z)||1;
        dirLight.position.set(p.x*Math.cos(a)-p.z*Math.sin(a), p.y+r*.3, p.x*Math.sin(a)+p.z*Math.cos(a));
      };
      const ctr=world.controls();
      if(ctr&&ctr.addEventListener){ctr.addEventListener('change',updLight);ctr.addEventListener('change',queueDeclutter);}
      updLight();
    }catch(e){}
  }
  /* Máscara de agua: los océanos reflejan la luz y la tierra queda mate.
     three.js no está expuesto como global, así que reutilizamos la clase Texture
     de una textura ya cargada. Si algo falla, simplemente no se aplica. */
  let especularTries=0;
  function aplicarEspecular(gm,activar){
    try{
      if(!activar){if(gm.specularMap){gm.specularMap=null;gm.needsUpdate=true;}return;}
      if(gm.specularMap||especularTex===false)return;
      if(especularTex){gm.specularMap=especularTex;gm.needsUpdate=true;return;}
      const base=gm.map||gm.bumpMap;
      if(!base||typeof base.constructor!=='function'){
        if(especularTries++<40)setTimeout(()=>{if(world)aplicarEspecular(world.globeMaterial(),activar);},250);
        return;
      }
      const Tex=base.constructor;
      const im=new Image();
      im.onload=()=>{try{const t=new Tex(im);t.needsUpdate=true;especularTex=t;
        const m=world&&world.globeMaterial();if(m&&style().water){m.specularMap=t;m.needsUpdate=true;}
      }catch(e){especularTex=false;}};
      im.onerror=()=>{especularTex=false;};
      im.src=GLOBE_TEX.agua;
    }catch(e){}
  }
  function applyLights(){
    if(!world||!world.lights)return;
    try{
      const ls=world.lights(); if(!ls||!ls.length)return;
      const s=style(), k=(opts.relief||0)/100;
      ls.forEach(l=>{
        if(l.isDirectionalLight)l.intensity=s.img?(.75+k*.75):.5;
        else if(l.isAmbientLight)l.intensity=s.img?(1.25-k*.4):1.1;
      });
    }catch(e){}
    if(updLight)updLight();
  }

  function init(){
    if(!available||world) return;
    ensureStars();
    host=$('#globe-host');
    if(!host){host=el('div',{id:'globe-host','aria-hidden':'true'});$('#main').appendChild(host);}
    chips=chipData();
    world=window.Globe({rendererConfig:{antialias:true}})(host)
      .backgroundColor('rgba(0,0,0,0)')
      .showGlobe(true)
      .showAtmosphere(true).atmosphereColor(style().atmos).atmosphereAltitude(style().atmosAlt)
      .polygonsData(polyData())
      .polygonCapColor(capColor)
      .polygonSideColor(sideColor)
      .polygonStrokeColor(strokeColor)
      .polygonAltitude(polyAlt)
      .polygonsTransitionDuration(0)
      .polygonLabel(f=>isCtx(f)?'':`<div class="globe-tip"><b>${byId(f.properties.id)?.nombreES||''}</b><span>★ ${byId(f.properties.id)?.capitalPrincipal||''}</span></div>`)
      .onPolygonClick(f=>{if(isCtx(f))return;const c=byId(f.properties.id);if(c){selectCountry(c,true);if(opts.onSelect)opts.onSelect(c);}})
      .onPolygonHover(f=>{const act=f&&!isCtx(f);setHover(act?f.properties.id:null);if(host)host.style.cursor=act?'pointer':'grab';})
      .pathsData([]).pathPoints(d=>d.pts).pathPointLat(p=>p[0]).pathPointLng(p=>p[1])
      .pathColor(gridColor).pathStroke(d=>d.key?.42:null).pathPointAlt(()=>.02)
      .pathTransitionDuration(0).pathResolution(2)
      .htmlElementsData(chips).htmlLat('lat').htmlLng('lng')
      .htmlAltitude(d=>d.type==='pais'?.035:.02)
      .htmlElement(chipNode).htmlTransitionDuration(0)
      .htmlElementVisibilityModifier((n,vis)=>{n.classList.toggle('behind',!vis);})
      .pointsData([]).pointLat('lat').pointLng('lng').pointColor(()=>'#ffd166').pointAltitude(.014).pointRadius(.26)
      .pointLabel(d=>`<div class="globe-tip"><b>★ ${d.name}</b><span>capital de ${d.pais||''}</span></div>`)
      .onPointClick(d=>{const c=byId(d.id);if(c){selectCountry(c,true);if(opts.onSelect)opts.onSelect(c);}})
      .arcsData([]).arcColor(()=>['rgba(255,209,102,.15)','rgba(255,209,102,.95)']).arcAltitudeAutoScale(.35).arcStroke(.6).arcDashLength(.5).arcDashGap(.15).arcDashAnimateTime(1600)
      .ringsData([]).ringColor(()=>t=>`rgba(255,209,102,${1-t})`).ringMaxRadius(3.4).ringPropagationSpeed(2).ringRepeatPeriod(900)
      .labelsData([]);
    world.onZoom(pov=>{
      if(!pov)return;
      let cambio=false;
      if(typeof pov.altitude==='number'&&Math.abs(pov.altitude-camAlt)>=.04){camAlt=pov.altitude;cambio=true;}
      if(typeof pov.lng==='number'&&Math.abs(pov.lng-camLng)>=10){camLng=pov.lng;moverEtiquetasDeLinea();cambio=true;}
      if(cambio)refreshChips(); else queueDeclutter();
    });
    window.__globo=world;   // handle de diagnóstico (consola del navegador)
    wireLight();
    const ctr=world.controls();
    ctr.enableZoom=true; ctr.minDistance=140; ctr.maxDistance=620; ctr.enablePan=false;
    world.pointOfView({lat:8,lng:-75,altitude:2.0},0);
    camAlt=2.0;
    applyPrefs();
    refreshLayers();
    ro=new ResizeObserver(()=>resize()); ro.observe(host);
    window.addEventListener('resize',resize);
  }
  function resize(){if(world&&host&&host.clientWidth){world.width(host.clientWidth).height(host.clientHeight);queueDeclutter();}}
  function applyPrefs(){
    if(!world)return; const c=Store.cfg(); const reduce=A11y.reducedMotion();
    opts.world=c.mundo!==false; opts.grid=c.meridianos!==false; opts.gridStep=Number(c.meridianosPaso)||15;
    opts.gridNamed=c.lineasClave!==false; opts.relief=(c.relieve==null?60:Number(c.relieve));
    opts.flags=c.banderas!==false;
    const ctr=world.controls();
    ctr.autoRotate=!!(opts.rotate&&c.rotate&&!reduce&&!tourTimer);
    ctr.autoRotateSpeed=.45;
    const q=c.quality;
    let pr=window.devicePixelRatio||1;
    if(q==='baja')pr=1; else if(q==='equilibrada')pr=Math.min(pr,1.5); else if(q==='alta')pr=Math.min(pr,2);
    else pr=Math.min(pr,1.75);
    try{world.renderer().setPixelRatio(pr);}catch(e){}
    world.showAtmosphere(q!=='baja').atmosphereColor(style().atmos).atmosphereAltitude(style().atmosAlt);
    world.ringRepeatPeriod(reduce?1e7:900);
    applyTexture();
  }
  function refreshLayers(){
    if(!world)return;
    world.polygonsData(polyData())
      .polygonCapColor(capColor).polygonSideColor(sideColor)
      .polygonStrokeColor(strokeColor).polygonAltitude(polyAlt);
    world.pathsData(gridPaths()).pathColor(gridColor);
    world.pointsData(opts.capitals?COUNTRIES.map(c=>({lat:c.coordenadasCapital.lat,lng:c.coordenadasCapital.lng,name:c.capitalPrincipal,pais:c.nombreES,id:c.id})):[]);
    refreshChips();
  }
  function selectCountry(c,fly){
    selectedId=c?c.id:null;
    if(world){
      world.polygonCapColor(capColor).polygonAltitude(polyAlt);
      refreshChips();
      if(c){
        world.arcsData([{startLat:c.coordenadasPais.lat,startLng:c.coordenadasPais.lng,endLat:c.coordenadasCapital.lat,endLng:c.coordenadasCapital.lng}]);
        world.ringsData([{lat:c.coordenadasCapital.lat,lng:c.coordenadasCapital.lng}]);
        if(fly)flyTo(c);
      }else{world.arcsData([]).ringsData([]);}
    }
  }
  function flyTo(c,alt){
    if(!world)return;
    const target=c.coordenadasCapital, a=alt||1.5;
    world.pointOfView({lat:target.lat-4,lng:target.lng,altitude:a},A11y.reducedMotion()?0:1100);
    camAlt=a; refreshChips();
  }
  function overview(region){
    const povs={norte:{lat:45,lng:-100,altitude:1.75},central:{lat:14,lng:-86,altitude:1.15},
      caribe:{lat:18,lng:-73,altitude:1.2},sur:{lat:-20,lng:-60,altitude:1.8},todas:{lat:8,lng:-80,altitude:2.0}};
    const p=povs[region]||povs.todas;
    if(!world)return;
    world.pointOfView(p,A11y.reducedMotion()?0:1200); camAlt=p.altitude; refreshChips();
  }
  function setView(v){if(!GLOBE_VIEWS[v])v='relieve';opts.view=v;if(world){applyTexture();refreshLayers();}}
  function setCapitals(b){opts.capitals=b;refreshLayers();}
  function setLabels(b){opts.labels=b;refreshChips();}
  function setRotate(b){opts.rotate=b;applyPrefs();}
  function setMastery(b){opts.mastery=b;refreshLayers();}
  function setVisible(v){if(!world)return;try{v?world.resumeAnimation():world.pauseAnimation();}catch(e){}}
  function setWorldGeo(g){worldGeo=g;if(world)refreshLayers();}

  function mount(slot,o={}){
    if(!available||!slot)return false;
    Object.assign(opts,o);
    if(!world)init();
    if(!host)return false;
    slot.appendChild(host);        // host único y persistente: nunca se recrea el contexto WebGL
    host.style.display='block'; host.setAttribute('aria-hidden','false');
    setVisible(true); refreshLayers(); applyPrefs();
    requestAnimationFrame(()=>{resize();setTimeout(resize,120);});
    if(selectedId){const c=byId(selectedId);if(c)selectCountry(c,false);}
    return true;
  }
  function detach(){
    stopTour();
    // las marcas (arcos país→capital, líneas de comparación, anillos) son de la vista
    // que las pidió: se limpian al salir para no arrastrarlas a la siguiente
    if(world)world.arcsData([]).ringsData([]);
    if(!host)return;
    host.style.display='none'; host.setAttribute('aria-hidden','true');
    const m=$('#main'); if(m)m.appendChild(host);
    setVisible(false);
  }
  function tour(list,{onStep,interval=3200,loop=false}={}){
    stopTour(); let i=0;
    const step=()=>{
      if(i>=list.length){ if(loop){i=0;} else {stopTour();onStep&&onStep(null,-1);return;} }
      const c=list[i]; selectCountry(c,true); onStep&&onStep(c,i,list.length); i++;
    };
    step(); tourTimer=setInterval(step,interval); applyPrefs();
    return {stop:stopTour};
  }
  function stopTour(){if(tourTimer){clearInterval(tourTimer);tourTimer=null;applyPrefs();}}
  function compareArc(a,b){
    if(!world)return;
    world.arcsData([{startLat:a.coordenadasCapital.lat,startLng:a.coordenadasCapital.lng,endLat:b.coordenadasCapital.lat,endLng:b.coordenadasCapital.lng}]);
    world.ringsData([{lat:a.coordenadasCapital.lat,lng:a.coordenadasCapital.lng},{lat:b.coordenadasCapital.lat,lng:b.coordenadasCapital.lng}]);
    const mlat=(a.coordenadasCapital.lat+b.coordenadasCapital.lat)/2, mlng=(a.coordenadasCapital.lng+b.coordenadasCapital.lng)/2;
    world.pointOfView({lat:mlat,lng:mlng,altitude:2},A11y.reducedMotion()?0:1100); camAlt=2; refreshChips();
  }
  function setGeo(g){geo=g;if(world)refreshLayers();}
  function getSelected(){return selectedId?byId(selectedId):null;}
  function arcChain(ids){if(!world)return;const pts=ids.map(byId).filter(Boolean);const arcs=[];
    for(let i=0;i<pts.length-1;i++){arcs.push({startLat:pts[i].coordenadasCapital.lat,startLng:pts[i].coordenadasCapital.lng,endLat:pts[i+1].coordenadasCapital.lat,endLng:pts[i+1].coordenadasCapital.lng});}
    world.arcsData(arcs);}
  function clearMarks(){selectedId=null;hoverId=null;if(world){world.arcsData([]).ringsData([]);refreshLayers();}}
  return {available,init,mount,detach,setGeo,setWorldGeo,selectCountry,flyTo,overview,setView,setCapitals,
    setLabels,setRotate,setMastery,setVisible,applyPrefs,refreshLayers,tour,stopTour,compareArc,getSelected,
    arcChain,clearMarks,resize,set onSelect(fn){opts.onSelect=fn;},get selectedId(){return selectedId;},
    get view(){return opts.view;}};
})();

/* ============================================================
   Map2D — mapa SVG accesible (fallback y alternativa)
   ============================================================ */
const Map2D=(function(){
  let geo=null, B=null; const W=1000, PAD=16;
  function setGeo(g){geo=g;computeBounds();}
  function computeBounds(){
    let minLng=Infinity,maxLng=-Infinity,minLat=Infinity,maxLat=-Infinity;
    for(const f of geo.features){eachRing(f.geometry,r=>{for(const [lng,lat] of r){
      if(lng<minLng)minLng=lng;if(lng>maxLng)maxLng=lng;if(lat<minLat)minLat=lat;if(lat>maxLat)maxLat=lat;}});}
    const midLat=(minLat+maxLat)/2, kx=Math.cos(midLat*Math.PI/180);
    const pxR=(maxLng-minLng)*kx, pyR=(maxLat-minLat);
    const scale=(W-2*PAD)/pxR, H=pyR*scale+2*PAD;
    B={minLng,maxLng,minLat,maxLat,kx,scale,H};
  }
  function eachRing(geom,cb){
    if(!geom)return;
    if(geom.type==='Polygon')geom.coordinates.forEach(cb);
    else if(geom.type==='MultiPolygon')geom.coordinates.forEach(p=>p.forEach(cb));
  }
  function px(lng,lat){return [PAD+(lng-B.minLng)*B.kx*B.scale, PAD+(B.maxLat-lat)*B.scale];}
  function inv(x,y){return {lng:B.minLng+(x-PAD)/(B.kx*B.scale), lat:B.maxLat-(y-PAD)/B.scale};}
  function pathD(geom){
    let d='';
    eachRing(geom,ring=>{ring.forEach(([lng,lat],i)=>{const [x,y]=px(lng,lat);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});d+='Z';});
    return d;
  }
  function render(container,o={}){
    const opt=Object.assign({onSelect:null,selectedId:null,mastery:false,capitals:true,labels:true,onLocationPick:null,interactive:true,region:'todas'},o);
    container.innerHTML='';
    const ns='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('class','map2d'); svg.setAttribute('viewBox',`0 0 ${W} ${B.H}`);
    svg.setAttribute('role','group'); svg.setAttribute('aria-label','Mapa 2D de América. Usá Tab para recorrer los países y Enter para seleccionar.');
    const feats=geo.features.filter(f=>opt.region==='todas'||f.properties.region===opt.region);

    if(opt.capitals){

        const ci=document.createElementNS(ns,'circle');ci.setAttribute('class','cap');ci.setAttribute('cx',x);ci.setAttribute('cy',y);ci.setAttribute('r',opt.selectedId===f.properties.id?4:2.4);ci.setAttribute('aria-hidden','true');ci.dataset.id=f.properties.id;svg.appendChild(ci);});
    }
    if(opt.labels){
      feats.filter(f=>['CAN','USA','MEX','BRA','ARG','COL','PER','BOL','VEN','CHL','GTM'].includes(f.properties.iso3)).forEach(f=>{
        const c=byId(f.properties.id);const [x,y]=px(c.coordenadasPais.lng,c.coordenadasPais.lat);
        const t=document.createElementNS(ns,'text');t.setAttribute('class','lbl');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor','middle');t.setAttribute('aria-hidden','true');t.textContent=c.nombreES;svg.appendChild(t);});

        const x=(e.clientX-pt.left)/pt.width*W, y=(e.clientY-pt.top)/pt.height*B.H;
        opt.onLocationPick(inv(x,y),{x,y,svg,ns});});

      select(id){$$('path.country',svg).forEach(p=>p.classList.toggle('sel',p.dataset.id===id));
        $$('circle.cap',svg).forEach(ci=>ci.setAttribute('r',ci.dataset.id===id?4:2.4));},

    };
  }
  return {setGeo,render,px:(lng,lat)=>px(lng,lat)};
})();

/* Genera una silueta SVG normalizada de un país (para tarjetas y práctica) */
function siluetaSVG(country,size=200,color='var(--accent)'){
  const g=window.__GEO; if(!g)return '';
  const f=g.features.find(x=>x.properties.id===country.id); if(!f)return '';
  let minLng=Infinity,maxLng=-Infinity,minLat=Infinity,maxLat=-Infinity;
  const rings=[];
  const walk=geom=>{const add=r=>{rings.push(r);for(const [lng,lat] of r){if(lng<minLng)minLng=lng;if(lng>maxLng)maxLng=lng;if(lat<minLat)minLat=lat;if(lat>maxLat)maxLat=lat;}};
    if(geom.type==='Polygon')geom.coordinates.forEach(add);else geom.coordinates.forEach(p=>p.forEach(add));};
  walk(f.geometry);
  const midLat=(minLat+maxLat)/2,kx=Math.cos(midLat*Math.PI/180);
  const pxR=(maxLng-minLng)*kx||1,pyR=(maxLat-minLat)||1;
  const s=(size-16)/Math.max(pxR,pyR); const w=pxR*s+16,h=pyR*s+16;
  let d='';
  rings.forEach(r=>{r.forEach(([lng,lat],i)=>{const x=8+(lng-minLng)*kx*s,y=8+(maxLat-lat)*s;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});d+='Z';});
  return `<svg viewBox="0 0 ${w.toFixed(0)} ${h.toFixed(0)}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="${d}" fill="${color}" stroke="rgba(255,255,255,.35)" stroke-width="1"/></svg>`;
}

/* ---------- Buscador con autocompletado ---------- */
function searchBox(onPick,placeholder='Buscar país o capital…'){
  const box=el('div',{class:'searchbox'});
  const input=el('input',{type:'search',placeholder,'aria-label':placeholder,autocomplete:'off',role:'combobox','aria-expanded':'false','aria-autocomplete':'list'});
  const list=el('div',{class:'autocomplete',role:'listbox',hidden:true});
  let idx=-1,matches=[];
  function close(){list.hidden=true;list.innerHTML='';input.setAttribute('aria-expanded','false');idx=-1;}
  function search(q){
    q=norm(q); if(!q){close();return;}
    matches=COUNTRIES.filter(c=>norm(c.nombreES).includes(q)||norm(c.capitalPrincipal).includes(q)||
      c.aliasPais.some(a=>norm(a).includes(q))||c.capitalesAceptadas.some(a=>norm(a).includes(q))).slice(0,8);
    list.innerHTML='';
    if(!matches.length){list.appendChild(el('button',{class:'muted',disabled:true,text:'Sin resultados'}));list.hidden=false;return;}
    matches.forEach((c,i)=>{
      list.appendChild(el('button',{type:'button',role:'option',onclick:()=>{pick(c);},onmouseenter:()=>setActive(i)},
        el('img',{src:c.bandera,alt:'',onerror:function(){this.style.visibility='hidden';}}),
        el('div',{},el('div',{style:'font-weight:600',text:c.nombreES}),el('small',{class:'muted',text:c.capitalPrincipal}))));
    });
    list.hidden=false;input.setAttribute('aria-expanded','true');idx=-1;
  }
  function setActive(i){idx=i;$$('button',list).forEach((b,k)=>b.classList.toggle('active',k===i));}
  function pick(c){input.value=c.nombreES;close();onPick(c);}
  input.addEventListener('input',()=>search(input.value));
  input.addEventListener('keydown',e=>{
    if(list.hidden)return;
    if(e.key==='ArrowDown'){e.preventDefault();setActive(clamp(idx+1,0,matches.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setActive(clamp(idx-1,0,matches.length-1));}
    else if(e.key==='Enter'){e.preventDefault();if(matches[idx])pick(matches[idx]);else if(matches[0])pick(matches[0]);}
    else if(e.key==='Escape')close();
  });
  const fuera=e=>{ if(!box.isConnected){document.removeEventListener('click',fuera);return;}
    if(!box.contains(e.target))close(); };
  document.addEventListener('click',fuera);
  box.append(input,list);
  return box;
}

    UI.announce(c.nombreES+', capital '+c.capitalPrincipal);
  }
  refreshStage();
  const initial=arg&&byId(arg);
  if(initial){select(initial);} else renderFicha(Globe.getSelected(),rightPanel);
}
