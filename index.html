/* ============================================================
   Quiz — generación de preguntas y distractores
   ============================================================ */
const CLASSIC_DISTRACTORS={ // ciudades NO capitales, tentadoras (se enseña por qué no)
  'canada':['Toronto','Montreal','Vancouver'],
  'estados-unidos':['Nueva York','Los Ángeles','Chicago'],
  'mexico':['Guadalajara','Monterrey','Cancún'],
  'brasil':['Río de Janeiro','São Paulo','Salvador'],
  'belice':['Ciudad de Belice','San Ignacio'],
  'ecuador':['Guayaquil','Cuenca'],
  'peru':['Cusco','Arequipa'],
  'bolivia':['Santa Cruz de la Sierra','Cochabamba'],
  'argentina':['Córdoba','Rosario'],
  'colombia':['Medellín','Cali','Cartagena'],
  'guatemala':['Quetzaltenango'],
  'venezuela':['Maracaibo','Valencia'],
  'chile':['Valparaíso','Concepción'],
};
const Quiz=(function(){
  function capOf(c){return c.capitalPrincipal;}
  function otherCaps(c,n,region){
    let pool=COUNTRIES.filter(x=>x.id!==c.id);
    let same=pool.filter(x=>x.regionPedagogica===(region&&region!=='todas'?region:c.regionPedagogica));
    let pick=shuffle(same).map(capOf);
    if(pick.length<n)pick=pick.concat(shuffle(pool.filter(x=>x.regionPedagogica!==c.regionPedagogica)).map(capOf));
    return uniq(pick).slice(0,n);
  }
  function otherCountries(c,n,region){
    let pool=COUNTRIES.filter(x=>x.id!==c.id);
    let same=pool.filter(x=>x.regionPedagogica===(region&&region!=='todas'?region:c.regionPedagogica));
    let pick=shuffle(same);
    if(pick.length<n)pick=pick.concat(shuffle(pool.filter(x=>x.regionPedagogica!==c.regionPedagogica)));
    return uniq(pick.map(x=>x.id)).slice(0,n).map(byId);
  }
  // Bolivia: elige subtipo y devuelve {q,answer,exclude,note}
  function boliviaCapital(){
    const constitucional=Math.random()<.5;
    return constitucional
      ? {label:'la capital constitucional de Bolivia',answer:'Sucre',exclude:'La Paz',note:'Sucre es la capital constitucional de Bolivia; La Paz es la sede del gobierno.'}
      : {label:'la sede de gobierno de Bolivia (Ejecutivo y Legislativo)',answer:'La Paz',exclude:'Sucre',note:'La Paz es la sede del gobierno; la capital constitucional es Sucre.'};
  }
  function buildMC(o){
    const {country:c,direction,optionCount=4,region}=o;
    let promptText,answer,options,media={},note='',accept=[];
    if(direction==='capital'){ // país -> capital
      if(c.id==='bolivia'){const b=boliviaCapital();
        promptText='¿Cuál es '+b.label+'?'; answer=b.answer; note=b.note;
        let ds=otherCaps(c,optionCount+1,region).filter(x=>x!==b.exclude&&x!==b.answer).slice(0,optionCount-1);
        options=shuffle([answer,...ds]);
      }else{
        promptText='¿Cuál es la capital de '+c.nombreES+'?'; answer=capOf(c);
        let classic=(CLASSIC_DISTRACTORS[c.id]||[]);
        let ds=uniq([...classic,...otherCaps(c,optionCount+2,region)]).filter(x=>x!==answer).slice(0,optionCount-1);
        options=shuffle([answer,...ds]);
      }
      accept=[answer];
    }else if(direction==='country'){ // capital -> país
      const capLabel=(c.id==='bolivia')?(Math.random()<.5?'Sucre':'La Paz'):capOf(c);
      promptText='¿De qué país es capital '+capLabel+'?'; answer=c.nombreES;
      let ds=otherCountries(c,optionCount-1,region).map(x=>x.nombreES);
      options=shuffle([answer,...ds]);
      accept=[answer]; if(c.id==='bolivia')note='Tanto Sucre como La Paz corresponden a Bolivia.';
    }else if(direction==='flag'){
      promptText='¿A qué país pertenece esta bandera?'; answer=c.nombreES; media.flag=c.bandera;
      let ds=otherCountries(c,optionCount-1,region).map(x=>x.nombreES);
      options=shuffle([answer,...ds]); accept=[answer];
    }else if(direction==='silhouette'){
      promptText='¿Qué país corresponde a esta silueta?'; answer=c.nombreES; media.silhouette=c.id;
      let ds=otherCountries(c,optionCount-1,region).map(x=>x.nombreES);
      options=shuffle([answer,...ds]); accept=[answer];
    }
    return {kind:'mc',countryId:c.id,promptText,answer,options,media,note,accept};
  }
  function buildText(o){
    const {country:c,direction}=o;
    let promptText,accept,answer,note='';
    if(direction==='capital'){
      if(c.id==='bolivia'){const b=boliviaCapital();promptText='Escribí '+b.label+':';answer=b.answer;accept=[b.answer];note=b.note;}
      else{promptText='Escribí la capital de '+c.nombreES+':';answer=capOf(c);accept=capitalAceptada(c);}
    }else{
      const capLabel=(c.id==='bolivia')?'La Paz o Sucre':capOf(c);
      promptText='Escribí el país cuya capital es '+capLabel+':';answer=c.nombreES;accept=paisAceptado(c);
    }
    return {kind:'text',countryId:c.id,promptText,answer,accept,note,media:{}};
  }
  function buildMap(o){
    const {country:c}=o;
    return {kind:'map',countryId:c.id,promptText:'Tocá '+c.nombreES+' en el mapa.',answer:c.nombreES,note:'',media:{}};
  }
  function buildLoc(o){
    const {country:c}=o;
    const capLabel=(c.id==='bolivia')?'La Paz (sede de gobierno)':c.capitalPrincipal;
    const target=(c.id==='bolivia')?{lat:-16.4897,lng:-68.1193}:c.coordenadasCapital;
    return {kind:'loc',countryId:c.id,promptText:'Tocá la ubicación aproximada de '+capLabel+'.',target,answer:capLabel,note:'',media:{}};
  }
  function buildQuestion(kind,opts){
    if(kind==='mc-capital')return buildMC({...opts,direction:'capital'});
    if(kind==='mc-country')return buildMC({...opts,direction:'country'});
    if(kind==='mc-flag')return buildMC({...opts,direction:'flag'});
    if(kind==='mc-silhouette')return buildMC({...opts,direction:'silhouette'});
    if(kind==='text-capital')return buildText({...opts,direction:'capital'});
    if(kind==='text-country')return buildText({...opts,direction:'country'});
    if(kind==='map-country')return buildMap(opts);
    if(kind==='loc-capital')return buildLoc(opts);
    return buildMC({...opts,direction:'capital'});
  }
  function pool(region,count,source){
    let base=inRegion(region);
    if(source==='fails')base=SR.dueList(base).length?SR.dueList(base):base;
    if(source==='daily'){const seed=hashStr(todayKey());base=seededPick(base,Math.min(count,base.length),seed);return base;}
    if(source==='adaptive')return SR.weightedPick(base,Math.min(count,base.length));
    return sample(base,Math.min(count,base.length));
  }
  function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function seededPick(arr,n,seed){let a=arr.slice(),out=[],s=seed;
    const rnd=()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};
    n=Math.min(n,a.length);for(let k=0;k<n;k++){out.push(a.splice(Math.floor(rnd()*a.length),1)[0]);}return out;}
  return {buildQuestion,pool,hashStr,seededPick};
})();

/* ============================================================
   Session — runner de práctica y examen (todos los modos)
   ============================================================ */
function haversine(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,
  la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));}

const LEVELS={
  principiante:{optionCount:3,timer:0,hints:true,text:false,label:'Principiante'},
  intermedio:{optionCount:4,timer:0,hints:true,text:false,label:'Intermedio'},
  avanzado:{optionCount:4,timer:0,hints:false,text:true,label:'Avanzado'},
  experto:{optionCount:4,timer:12,hints:false,text:true,label:'Experto'},
};

function runSession(container,cfg,onFinish){
  cfg=Object.assign({region:'todas',count:10,kinds:['mc-capital'],level:'intermedio',
    source:'adaptive',mode:'practica',timer:0,lives:0,stopOnError:false,immediateFeedback:true,
    hints:null,title:'Práctica',countdown:0},cfg);
  const lv=LEVELS[cfg.level]||LEVELS.intermedio;
  const optionCount=lv.optionCount;
  const useHints=cfg.hints!=null?cfg.hints:lv.hints;
  cfg.count=clamp(Math.round(Number(cfg.count)||10),1,COUNTRIES.length);
  const items=(cfg.customItems&&cfg.customItems.length)?cfg.customItems:Quiz.pool(cfg.region,cfg.count,cfg.source);
  if(!items.length){container.appendChild(el('div',{class:'empty-state'},el('p',{text:'No hay países para practicar con esta configuración.'})));return;}
  const questions=items.map((c,i)=>{
    const kind=cfg.kinds[i%cfg.kinds.length];
    return Quiz.buildQuestion(kind,{country:c,optionCount,region:cfg.region});
  });
  let idx=0,score=0,streak=0,maxStreak=0,lives=cfg.lives,hintsUsed=0;
  const results=[]; const t0=Date.now(); let qStart=0;
  let totalTimer=cfg.countdown||0, timerInt=null, perTimer=lv.timer||0, perInt=null, answered=false;
  let keyHandler=null;
  function clearKeyHandler(){if(keyHandler){document.removeEventListener('keydown',keyHandler);keyHandler=null;}}

  const wrap=el('div',{class:'quiz-wrap'});
  const top=el('div',{class:'quiz-top'});
  const prog=el('div',{class:'quiz-progress'},el('div',{class:'bar'},el('span',{style:'width:0%'})));
  const counter=el('div',{class:'dim',style:'font-weight:600;font-size:.9rem'});
  const timerEl=el('div',{class:'quiz-timer'});
  const livesEl=el('div',{class:'dim',style:'font-weight:700'});
  // Element.append() convierte null en el texto "null": filtramos antes de insertar
  [el('div',{style:'flex:1;min-width:160px'},counter,prog),
   cfg.lives?livesEl:null, (totalTimer||perTimer)?timerEl:null]
    .filter(Boolean).forEach(n=>top.append(n));
  const qArea=el('div',{'aria-live':'polite'});
  const controls=el('div',{class:'row between',style:'margin-top:16px'});
  wrap.append(top,qArea,controls);
  container.innerHTML=''; container.appendChild(wrap);

  if(totalTimer){startTotalTimer();}

  function startTotalTimer(){
    updateTimer(totalTimer);
    timerInt=setInterval(()=>{if(!container.isConnected){clearInterval(timerInt);return;}
      totalTimer--;updateTimer(totalTimer);
      if(totalTimer<=0){clearInterval(timerInt);finish('tiempo');}},1000);
  }
  function updateTimer(s){if(!timerEl)return;timerEl.textContent='⏱ '+fmtTime(s);timerEl.classList.toggle('low',s<=10);}
  function startPerTimer(){
    if(!perTimer)return; let t=perTimer; updateTimer(t);
    perInt=setInterval(()=>{if(!container.isConnected){clearInterval(perInt);return;}
      t--;updateTimer(t);if(t<=0){clearInterval(perInt);if(!answered)evaluate(null);}},1000);
  }

  function render(){
    clearKeyHandler();
    answered=false; qStart=Date.now();
    const q=questions[idx];
    counter.textContent='Pregunta '+(idx+1)+' de '+questions.length+' · '+REGIONS[byId(q.countryId).regionPedagogica].nombre;
    prog.querySelector('span').style.width=(idx/questions.length*100)+'%';
    qArea.innerHTML=''; controls.innerHTML='';
    if(perTimer){clearInterval(perInt);startPerTimer();}
    UI.announce(q.promptText);
    if(q.kind==='mc')renderMC(q);
    else if(q.kind==='text')renderText(q);
    else if(q.kind==='map')renderMap(q);
    else if(q.kind==='loc')renderLoc(q);
  }
  function mediaNode(q){
    if(q.media.flag)return el('img',{src:q.media.flag,alt:'Bandera a identificar',style:'width:180px;max-width:70%;border-radius:8px;border:1px solid var(--border);display:block;margin:0 auto 14px'});
    if(q.media.silhouette){const d=el('div',{style:'width:200px;height:160px;margin:0 auto 14px'});d.innerHTML=siluetaSVG(byId(q.media.silhouette),200,'var(--accent)');return d;}
    return null;
  }
  function renderMC(q){
    const m=mediaNode(q); if(m)qArea.appendChild(m);
    qArea.appendChild(el('div',{class:'quiz-q',text:q.promptText}));
    const grid=el('div',{class:'options'});
    q.options.forEach((opt,i)=>{
      const b=el('button',{class:'opt',type:'button'},
        el('span',{class:'key','aria-hidden':'true',text:String(i+1)}),
        el('span',{text:opt}));
      b.addEventListener('click',()=>{if(!answered)evaluate(opt,b,grid);});
      grid.appendChild(b);
    });
    qArea.appendChild(grid);
    // pistas visuales (principiante): resalta país en mini-mapa
    if(useHints){qArea.appendChild(hintNode(q));}
    keyNums(grid,q.options.length);
  }
  function keyNums(grid,n){
    clearKeyHandler();
    keyHandler=e=>{const k=parseInt(e.key);if(k>=1&&k<=n&&!answered){const b=grid.children[k-1];if(b)b.click();}};
    document.addEventListener('keydown',keyHandler);
  }
  function hintNode(q){
    const box=el('details',{class:'card',style:'margin-top:12px;background:var(--bg-1)'});
    box.appendChild(el('summary',{style:'cursor:pointer;color:var(--accent);font-weight:600',text:'Pista'}));
    const c=byId(q.countryId);
    box.appendChild(el('div',{style:'margin-top:8px',text:c.ayudaMemoria}));
    box.addEventListener('toggle',()=>{if(box.open){hintsUsed++;}});
    return box;
  }
  function renderText(q){
    qArea.appendChild(el('div',{class:'quiz-q',text:q.promptText}));
    const input=el('input',{type:'text',autocomplete:'off',autocapitalize:'off',spellcheck:false,
      style:'width:100%;font-size:1.1rem','aria-label':q.promptText,placeholder:'Escribí tu respuesta…'});
    const form=el('form',{onsubmit:e=>{e.preventDefault();if(!answered)evaluate(input.value,input);}});
    const rowBtns=el('div',{class:'row',style:'margin-top:12px'},
      el('button',{class:'btn primary',type:'submit',text:'Responder'}),
      useHints?el('button',{class:'btn ghost',type:'button',text:'Pista',onclick:()=>{hintsUsed++;UI.toast('Pista','info',byId(q.countryId).ayudaMemoria);}}):null);
    if(cfg.voice){
      const SR_=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(SR_){rowBtns.appendChild(el('button',{class:'btn ghost',type:'button',html:'🎙 Hablar',onclick:function(){
        try{const rec=new SR_();rec.lang='es-ES';rec.interimResults=false;this.textContent='Escuchando…';
          rec.onresult=e=>{input.value=e.results[0][0].transcript;this.innerHTML='🎙 Hablar';};
          rec.onerror=()=>{this.innerHTML='🎙 Hablar';UI.toast('No se pudo usar el micrófono','warn','Escribí la respuesta');};
          rec.onend=()=>{this.innerHTML='🎙 Hablar';};rec.start();
        }catch(err){UI.toast('Voz no disponible','warn');}
      }}));}
      else rowBtns.appendChild(el('span',{class:'muted',style:'font-size:.82rem',text:'(voz no disponible en este navegador)'}));
    }
    form.append(input,rowBtns);
    qArea.appendChild(form);
    setTimeout(()=>input.focus(),40);
  }
  function renderMap(q){
    qArea.appendChild(el('div',{class:'quiz-q',text:q.promptText}));
    const holder=el('div');
    if(Globe.available){
      const stage=buildStage({region:cfg.region,onSelect:c=>{if(!answered)evaluate(c.nombreES,null,null,c);}});
      stage.style.minHeight='min(60vh,520px)'; holder.appendChild(stage);
    }else{
      Map2D.render(holder,{region:cfg.region,onSelect:c=>{if(!answered)evaluate(c.nombreES,null,null,c);},capitals:false});
    }
    qArea.appendChild(holder);
  }
  function renderLoc(q){
    qArea.appendChild(el('div',{class:'quiz-q',text:q.promptText}));
    const holder=el('div');
    const api=Map2D.render(holder,{region:'todas',interactive:false,capitals:false,labels:true,
      onLocationPick:(coord)=>{if(answered)return; const d=haversine(coord,q.target);
        api.marker(coord.lat,coord.lng,'#fb7185'); api.marker(q.target.lat,q.target.lng,'#34d399');
        evaluate(d<=500?'__ok__':'__far__',null,null,null,d);}});
    qArea.appendChild(holder);
    qArea.appendChild(el('div',{class:'muted',style:'margin-top:8px;font-size:.85rem',text:'Tocá el mapa donde creas que está la capital (tolerancia ~500 km).'}));
  }

  function evaluate(given,btn,grid,pickedCountry,dist){
    if(answered)return; answered=true;
    if(perInt)clearInterval(perInt);
    const q=questions[idx]; const ms=Date.now()-qStart;
    let correct=false;
    if(q.kind==='mc')correct=(given===q.answer);
    else if(q.kind==='text')correct=answerMatches(given,q.accept);
    else if(q.kind==='map')correct=(pickedCountry&&pickedCountry.id===q.countryId);
    else if(q.kind==='loc')correct=(given==='__ok__');
    // registrar SR + stats
    SR.record(q.countryId,correct,ms);
    const st=Store.get().stats; st.answered++; if(correct)st.correct++; Store.save();
    if(correct){score++;streak++;maxStreak=Math.max(maxStreak,streak);Game.addPoints(cfg.mode==='examen'?12:8);Game.bumpStreak(streak);Audio.play('ok');}
    else{streak=0;if(cfg.lives)lives--;Audio.play('bad');}
    results.push({q,correct,ms,given,dist});
    if(cfg.mode!=='examen'||cfg.immediateFeedback)showFeedback(q,correct,given,btn,grid,dist);
    else nextControls(true);
    if(cfg.lives){livesEl.textContent='❤ '.repeat(Math.max(0,lives))||'Sin vidas';}
    prog.querySelector('span').style.width=((idx+1)/questions.length*100)+'%';
  }
  function showFeedback(q,correct,given,btn,grid,dist){
    if(grid){$$('.opt',grid).forEach(b=>{const lbl=b.querySelector('span:last-child').textContent;
      b.disabled=true;
      if(lbl===q.answer)b.classList.add('correct');
      else if(lbl===given)b.classList.add('wrong');});}
    const c=byId(q.countryId);
    const fb=el('div',{class:'feedback '+(correct?'ok':'bad'),role:'status'},
      el('h4',{text:correct?'¡Correcto!':'Incorrecto'}),
      el('div',{}, correct?'':(el('span',{},'Respuesta correcta: ')), el('b',{text:q.answer})),
      (q.kind==='loc'&&dist!=null)?el('div',{class:'note',style:'margin-top:6px',text:'Marcaste a ~'+Math.round(dist).toLocaleString('es-AR')+' km (tolerancia 500 km).'}):null,
      q.note?el('div',{class:'note',style:'margin-top:6px',text:q.note}):null,
      el('div',{class:'note',style:'margin-top:6px',text:c.ayudaMemoria}));
    qArea.appendChild(fb);
    if(Store.cfg().sound&&correct)Audio.speak(q.answer);
    if(cfg.stopOnError&&!correct){nextControls(false,true);return;}
    if(cfg.lives&&lives<=0){nextControls(false,true);return;}
    nextControls(false);
  }
  function nextControls(deferred,forceEnd){
    controls.innerHTML='';
    const last=idx>=questions.length-1;
    const btn=el('button',{class:'btn primary',text:(last||forceEnd)?'Ver resultados':'Siguiente',onclick:()=>{
      clearKeyHandler();
      if(last||forceEnd)finish('completo'); else {idx++;render();}}});
    controls.appendChild(el('div',{class:'dim',style:'font-weight:700',text:'Aciertos: '+score+' / '+(idx+1)}));
    controls.appendChild(btn);
    setTimeout(()=>btn.focus(),40);
  }
  function finish(reason){
    clearKeyHandler();
    if(timerInt)clearInterval(timerInt); if(perInt)clearInterval(perInt);
    const totalMs=Date.now()-t0;
    Store.get().stats.studySeconds+=Math.round(totalMs/1000);
    // velocidad geográfica (contrarreloj con 10+ aciertos)
    if(cfg.countdown&&score>=10)Store.get().stats.velocidad=true;
    Store.save();
    Game.checkAchievements();
    // En examen las no respondidas cuentan como error; en práctica (vidas, sin errores,
    // contrarreloj) la precisión se calcula sobre lo que efectivamente se respondió.
    const total=(cfg.mode==='examen')?questions.length:(results.length||questions.length);
    onFinish&&onFinish({results,score,total,planeadas:questions.length,maxStreak,totalMs,hintsUsed,reason,cfg});
  }
  render();
  return {finish};
}

function runOrder(container,cfg,onFinish){
  const n=Math.min(cfg.count||5,6,inRegion(cfg.region).length);
  let list=shuffle(sample(inRegion(cfg.region),n));
  const wrap=el('div',{class:'quiz-wrap'});
  wrap.appendChild(el('div',{class:'quiz-q',text:'Ordená los países de NORTE (arriba) a SUR (abajo).'}));
  const ul=el('ul',{class:'list-clean',role:'list'});
  function draw(){
    ul.innerHTML='';
    list.forEach((c,i)=>{
      const li=el('li',{class:'card',style:'display:flex;align-items:center;gap:10px'});
      li.append(
        el('span',{class:'chip',text:'#'+(i+1)}),
        el('img',{src:c.bandera,alt:'',style:'width:30px;height:20px;border-radius:3px;object-fit:cover',onerror:function(){this.style.display='none';}}),
        el('b',{style:'flex:1',text:c.nombreES}),
        el('button',{class:'btn sm icon','aria-label':'Subir '+c.nombreES,disabled:i===0,html:'▲',onclick:()=>{[list[i-1],list[i]]=[list[i],list[i-1]];draw();}}),
        el('button',{class:'btn sm icon','aria-label':'Bajar '+c.nombreES,disabled:i===list.length-1,html:'▼',onclick:()=>{[list[i+1],list[i]]=[list[i],list[i+1]];draw();}}));
      ul.appendChild(li);
    });
  }
  draw(); wrap.appendChild(ul);
  let comprobado=false;
  const btn=el('button',{class:'btn primary',style:'margin-top:14px',text:'Comprobar orden',onclick:()=>{
    if(comprobado)return; comprobado=true; btn.disabled=true;
    $$('button',ul).forEach(b=>b.disabled=true);
    const correctOrder=list.slice().sort((a,b)=>b.coordenadasPais.lat-a.coordenadasPais.lat);
    let ok=0; const results=[];
    list.forEach((c,i)=>{const good=c.id===correctOrder[i].id;if(good)ok++;
      SR.record(c.id,good,0);results.push({q:{countryId:c.id,answer:c.nombreES,promptText:'Posición N→S',kind:'order'},correct:good,ms:0});});
    Audio.play(ok===n?'win':'ok');
    onFinish&&onFinish({results,score:ok,total:n,maxStreak:0,totalMs:0,hintsUsed:0,reason:'orden',cfg,
      extra:'Orden correcto (N→S): '+correctOrder.map(c=>c.nombreES).join(' → ')});
  }});
  wrap.appendChild(btn);
  container.innerHTML=''; container.appendChild(wrap);
}
function runMatch(container,cfg,onFinish){
  const n=Math.min(cfg.count||5,6,inRegion(cfg.region).length);
  const items=sample(inRegion(cfg.region),n);
  const caps=shuffle(items.slice());
  let selPais=null,matched=0,attempts=0; const results=[];
  const wrap=el('div',{class:'quiz-wrap'});
  wrap.appendChild(el('div',{class:'quiz-q',text:'Relacioná cada país con su capital. Tocá un país y luego su capital.'}));
  const grid=el('div',{class:'grid cols-2'});
  const colP=el('div',{class:'stack'}),colC=el('div',{class:'stack'});
  colP.appendChild(el('div',{class:'kick',text:'Países'})); colC.appendChild(el('div',{class:'kick',text:'Capitales'}));
  items.forEach(c=>{colP.appendChild(el('button',{class:'btn block',dataset:{id:c.id},text:c.nombreES,onclick:function(){selectP(c,this);}}));});
  caps.forEach(c=>{const cap=(c.id==='bolivia')?'Sucre / La Paz':c.capitalPrincipal;
    colC.appendChild(el('button',{class:'btn block',dataset:{id:c.id},text:cap,onclick:function(){selectC(c,this);}}));});
  grid.append(colP,colC); wrap.appendChild(grid);
  container.innerHTML=''; container.appendChild(wrap);
  let curBtn=null;
  function selectP(c,btn){if(btn.disabled)return;selPais=c;$$('button',colP).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');curBtn=btn;}
  function selectC(c,btn){
    if(btn.disabled||!selPais)return; attempts++;
    const good=c.id===selPais.id; SR.record(selPais.id,good,0);
    results.push({q:{countryId:selPais.id,answer:selPais.capitalPrincipal,promptText:selPais.nombreES,kind:'match'},correct:good,ms:0});
    if(good){btn.classList.add('ok');btn.disabled=true;curBtn.classList.add('ok');curBtn.classList.remove('selected');curBtn.disabled=true;matched++;Audio.play('ok');
      if(matched>=n){Audio.play('win');onFinish&&onFinish({results,score:matched,total:Math.max(attempts,n),maxStreak:0,totalMs:0,hintsUsed:0,reason:'match',cfg,
        extra:attempts>n?('Resolviste los '+n+' pares en '+attempts+' intentos.'):'Resolviste todos los pares sin errores.'});}}
    else{btn.classList.add('wrong');Audio.play('bad');const bb=btn;setTimeout(()=>bb.classList.remove('wrong'),500);}
    selPais=null;$$('button',colP).forEach(b=>b.classList.remove('selected'));
  }
}

/* ============================================================
   Resumen de actividad (práctica)
   ============================================================ */
function renderSummary(host,data,opts={}){
  const {score,total,maxStreak,totalMs,results}=data;
  const pct=Math.round(score/total*100);
  const box=el('div',{class:'quiz-wrap'});
  box.appendChild(el('div',{class:'panel',style:'text-align:center'},
    el('div',{class:'kick',text:'Resultado'}),
    el('div',{class:'donut',style:'--v:'+pct+';margin:10px auto'},el('span',{class:'val',text:pct+'%'})),
    el('h2',{text:score+' / '+total+' correctas'}),
    el('div',{class:'stat-row',style:'margin-top:12px'},
      metric(pct+'%','Precisión'),
      maxStreak?metric(maxStreak,'Mejor racha'):null,
      totalMs?metric(fmtTime(totalMs/1000),'Tiempo'):null)));
  if(data.planeadas&&data.planeadas>total)
    box.appendChild(el('div',{class:'card',style:'margin-top:12px'},
      el('div',{class:'muted',text:'La ronda terminó antes: respondiste '+total+' de '+data.planeadas+' preguntas previstas.'})));
  if(data.extra)box.appendChild(el('div',{class:'card',style:'margin-top:12px',text:data.extra}));
  const errs=results.filter(r=>!r.correct);
  if(errs.length){
    const list=el('div',{class:'panel',style:'margin-top:12px'},el('h3',{text:'Para repasar ('+errs.length+')'}));
    errs.forEach(r=>{const c=byId(r.q.countryId);
      list.appendChild(el('div',{class:'kv'},el('span',{class:'k',text:c.nombreES}),el('span',{class:'v',text:r.q.answer})));});
    box.appendChild(list);
  }else{box.appendChild(el('div',{class:'feedback ok',style:'margin-top:12px'},el('h4',{text:'¡Sin errores!'}),el('div',{text:'Excelente trabajo.'})));UI.celebrate();}
  const row=el('div',{class:'row',style:'margin-top:16px;justify-content:center'});
  if(opts.onRetry)row.appendChild(el('button',{class:'btn primary',text:'Repetir',onclick:opts.onRetry}));
  if(errs.length&&opts.onReviewFails)row.appendChild(el('button',{class:'btn',text:'Repetir mis errores',onclick:()=>opts.onReviewFails(errs.map(r=>r.q.countryId))}));
  if(opts.onExit)row.appendChild(el('button',{class:'btn ghost',text:'Volver',onclick:opts.onExit}));
  box.appendChild(row);
  host.innerHTML=''; host.appendChild(box);
  host.scrollIntoView&&host.scrollIntoView({behavior:document.documentElement.dataset.motion==='reduced'?'auto':'smooth',block:'start'});
}

  root.appendChild(viewHead('Aprender','Recorridos guiados','Dejá que la cámara te lleve país por país. Cada 3-4 países aparece una pregunta rápida para fijar lo aprendido.'));
  const tours=[
    {id:'norte',t:'América del Norte',n:3},{id:'central',t:'América Central',n:7},
    {id:'caribe',t:'Caribe',n:13},{id:'sur',t:'América del Sur',n:12},
    {id:'todas',t:'Toda América (N→S)',n:35},
  ];
  const grid=el('div',{class:'grid cols-3'});
  tours.forEach(t=>{
    grid.appendChild(el('button',{class:'card hoverable',style:'text-align:left',onclick:()=>startTour(t.id)},
      el('div',{class:'row',style:'gap:8px;margin-bottom:4px'},t.id!=='todas'?el('span',{class:'tag '+t.id,text:REGIONS[t.id].nombre}):el('span',{class:'chip on',text:'Completo'})),
      el('b',{text:t.t}),el('div',{class:'muted',style:'font-size:.85rem',text:t.n+' países'})));
  });
  root.appendChild(grid);

  function orderedList(region){
    let list=inRegion(region);
    // orden geográfico N→S; para 'todas' se recorre norte→central→caribe→sur
    if(region==='todas'){
      return REGION_ORDER.flatMap(r=>inRegion(r).sort((a,b)=>b.coordenadasPais.lat-a.coordenadasPais.lat));
    }
    return list.sort((a,b)=>b.coordenadasPais.lat-a.coordenadasPais.lat);
  }
  function startTour(region){
    const list=orderedList(region);
    root.innerHTML='';
    root.appendChild(el('div',{class:'row between',style:'margin-bottom:12px'},
      el('button',{class:'btn ghost sm',html:'&larr; Recorridos',onclick:()=>{clearTimeout(timer);Globe.stopTour();viewAprender(root);}}),
      el('h2',{style:'margin:0;font-size:1.1rem',text:'Recorrido: '+(region==='todas'?'Toda América':REGIONS[region].nombre)})));
    const layout=el('div',{class:'explore-grid'});
    const left=el('div'); const info=el('aside',{class:'panel ficha'});
    layout.append(left,info); root.appendChild(layout);

    let i=0,paused=false,timer=null,seen=[];
    if(Globe.available){
      const stage=buildStage({region});left.appendChild(stage);
    }else{
      const holder=el('div',{class:'panel',style:'padding:10px'});Map2D.render(holder,{region,onSelect:()=>{},selectedId:null});left.appendChild(holder);
    }
    const bar=el('div',{class:'row',style:'margin-top:12px;justify-content:center;gap:8px'});
    const prevB=el('button',{class:'btn sm',html:'&larr; Anterior',onclick:()=>{go(i-1);}});
    const pauseB=el('button',{class:'btn sm primary',text:'Pausar',onclick:()=>togglePause()});
    const nextB=el('button',{class:'btn sm',html:'Siguiente &rarr;',onclick:()=>{go(i+1);}});
    bar.append(prevB,pauseB,nextB); left.appendChild(bar);
    const progBar=el('div',{class:'bar',style:'margin-top:10px'},el('span',{style:'width:0%'}));
    left.appendChild(progBar);

    function show(c){
      renderFicha(c,info);
      if(Globe.available)Globe.selectCountry(c,true);
      Audio.speak(c.nombreES+'. Capital: '+c.capitalPrincipal);
      progBar.querySelector('span').style.width=((i+1)/list.length*100)+'%';
      UI.announce(c.nombreES+', capital '+c.capitalPrincipal+'. País '+(i+1)+' de '+list.length);
      prevB.disabled=i===0;
    }
    function go(j){
      if(j<0)return;
      if(!vivo()){clearTimeout(timer);return;}
      if(j>=list.length){finishTour();return;}
      // pregunta rápida cada 4 países
      if(j>0 && j%4===0 && !seen.includes(j)){seen.push(j);quickQuestion(list[j-1],()=>{i=j;show(list[i]);scheduleNext();});return;}
      i=j;show(list[i]);scheduleNext();
    }
    function vivo(){return root.isConnected&&left.isConnected;}
    function scheduleNext(){clearTimeout(timer);
      if(!paused&&i<list.length-1){timer=setTimeout(()=>{if(vivo())go(i+1);},3600);}}
    function togglePause(){paused=!paused;pauseB.textContent=paused?'Reanudar':'Pausar';if(paused)clearTimeout(timer);else scheduleNext();}
    function quickQuestion(c,cont){

        Audio.play(ok?'ok':'bad');

      }})));
      body.appendChild(opts);
      const m=UI.modal(body,{title:'Pregunta rápida'});
    }
    function finishTour(){
      Globe.stopTour&&Globe.stopTour();
      info.innerHTML='';
      info.appendChild(el('div',{class:'feedback ok'},el('h4',{text:'¡Recorrido completado!'}),
        el('div',{text:'Repasaste '+list.length+' países.'})));
      info.appendChild(el('div',{class:'row',style:'margin-top:12px'},
        el('button',{class:'btn primary',text:'Practicar esta región',onclick:()=>Router.go('practica')}),
        el('button',{class:'btn ghost',text:'Otro recorrido',onclick:()=>{viewAprender(root);}})));
      Game.checkAchievements();
    }
    go(0);
  }
}

function balancedItems(region,count){
  if(region!=='todas')return sample(inRegion(region),Math.min(count,inRegion(region).length));
  // reparto proporcional por región para cobertura equilibrada
  const per={}; let items=[];
  const total=COUNTRIES.length;
  REGION_ORDER.forEach(r=>{per[r]=Math.max(1,Math.round(count*inRegion(r).length/total));});
  REGION_ORDER.forEach(r=>{items=items.concat(sample(inRegion(r),Math.min(per[r],inRegion(r).length)));});
  items=shuffle(items);
  if(items.length>count)items=items.slice(0,count);
  while(items.length<count){const extra=shuffle(COUNTRIES).find(c=>!items.includes(c));if(!extra)break;items.push(extra);}
  return items;
}

function svgLine(data,w,h){
  if(data.length<2)return el('div',{class:'muted',style:'padding:20px;text-align:center',text:'Hacé al menos 2 evaluaciones para ver tu evolución.'});
  const max=100,min=0,pad=24;
  const xs=(i)=>pad+i*((w-2*pad)/(data.length-1));
  const ys=(v)=>h-pad-((v-min)/(max-min))*(h-2*pad);
  let d='';data.forEach((v,i)=>{d+=(i?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1);});
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+w+' '+h);svg.setAttribute('width','100%');svg.setAttribute('role','img');svg.setAttribute('aria-label','Evolución de notas: '+data.join(', '));
  [0,50,70,100].forEach(gy=>{const l=document.createElementNS(ns,'line');l.setAttribute('x1',pad);l.setAttribute('x2',w-pad);l.setAttribute('y1',ys(gy));l.setAttribute('y2',ys(gy));l.setAttribute('stroke',gy===70?'rgba(52,211,153,.4)':'rgba(255,255,255,.08)');l.setAttribute('stroke-dasharray',gy===70?'4 4':'');svg.appendChild(l);});
  const path=document.createElementNS(ns,'path');path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke','var(--accent)');path.setAttribute('stroke-width','2.5');path.setAttribute('stroke-linejoin','round');svg.appendChild(path);
  data.forEach((v,i)=>{const c=document.createElementNS(ns,'circle');c.setAttribute('cx',xs(i));c.setAttribute('cy',ys(v));c.setAttribute('r',3.5);c.setAttribute('fill',v>=70?'var(--ok)':'var(--warn)');svg.appendChild(c);});
  return svg;
}

  const wrongCountries=COUNTRIES.map(c=>({c,w:Store.prog(c.id).wrong})).filter(x=>x.w>0).sort((a,b)=>b.w-a.w).slice(0,8);
  const errPanel=el('div',{class:'panel',style:'margin-top:14px'},el('h3',{text:'Errores más frecuentes'}));
  if(wrongCountries.length){
    wrongCountries.forEach(x=>{
      errPanel.appendChild(el('div',{class:'kv'},
        el('span',{class:'k'},el('b',{text:x.c.nombreES}),document.createTextNode(' → '+x.c.capitalPrincipal)),
        el('span',{class:'v',text:x.w+(x.w===1?' error':' errores')})));
    });
  }else errPanel.appendChild(el('div',{class:'muted',text:'Sin errores registrados. ¡Bien ahí!'}));
  errPanel.appendChild(el('button',{class:'btn sm',style:'margin-top:10px',text:'Repasar mis fallos',onclick:()=>Router.go('practica')}));
  root.appendChild(errPanel);

  // matriz de dominio
  root.appendChild(masteryPanel());

  // logros
  const ach=el('div',{class:'panel',style:'margin-top:14px'},el('h3',{text:'Logros'}));
  const ag=el('div',{class:'grid cols-3'});

      el('div',{class:'ico',html:svgIcon(ICON.trophy)}),
      el('div',{},el('b',{text:a.nombre}),el('small',{text:unlocked?'Desbloqueado':a.desc}))));});
  ach.appendChild(ag);
  // certificado
  if(COUNTRIES.every(c=>SR.level(c.id)==='dominado')){
    ach.appendChild(el('div',{class:'feedback ok',style:'margin-top:12px'},el('h4',{text:'🎓 Certificado: 35 de 35'}),

      el('button',{class:'btn sm',style:'margin-top:8px',text:'Ver certificado',onclick:showCertificate})));
  }

  root.appendChild(el('div',{class:'row',style:'margin-top:14px'},
    el('button',{class:'btn ghost sm',text:'Exportar / Importar / Reiniciar',onclick:()=>Router.go('config')})));
}

/* ============================================================
   Vista: COMPARADOR
   ============================================================ */
function viewComparador(root,arg){
  if(Globe&&Globe.detach)Globe.detach();   // soltar el globo antes de vaciar
  root.innerHTML='';   // las vistas pueden re-renderizarse sobre sí mismas
  let a=byId(arg)||byId('argentina'), b=byId('brasil');
  if(a.id===b.id)b=byId(a.id==='brasil'?'chile':'brasil');
  root.appendChild(viewHead('Comparar','Comparador de países','Elegí dos países y compará sus datos. El globo muestra ambos y una línea entre sus capitales.'));
  const sel=el('div',{class:'grid cols-2'});
  const opts=COUNTRIES.map(c=>[c.id,c.nombreES]).sort((x,y)=>x[1].localeCompare(y[1]));
  sel.append(
    field('País A',selectEl(opts,a.id,v=>{a=byId(v);if(a.id===b.id){UI.toast('Elegí dos países distintos','info');return;}draw();})),
    field('País B',selectEl(opts,b.id,v=>{b=byId(v);if(a.id===b.id){UI.toast('Elegí dos países distintos','info');return;}draw();})));
  root.appendChild(sel);
  const stageHost=el('div',{style:'margin-top:12px'});
  const cmp=el('div',{style:'margin-top:14px'});
  root.append(stageHost,cmp);

  function draw(){
    // globo
    stageHost.innerHTML='';
    if(Globe.available){
      const stage=buildStage({region:'todas'});stage.style.minHeight='42vh';stageHost.appendChild(stage);
      requestAnimationFrame(()=>{Globe.resize();Globe.compareArc(a,b);});
    }else{
      const holder=el('div',{class:'panel',style:'padding:10px'});const api=Map2D.render(holder,{region:'todas',interactive:false,capitals:true,selectedId:null});
      api.marker(a.coordenadasCapital.lat,a.coordenadasCapital.lng,'#38bdf8');api.marker(b.coordenadasCapital.lat,b.coordenadasCapital.lng,'#c58bfa');stageHost.appendChild(holder);
    }
    const dist=Math.round(haversine(a.coordenadasCapital,b.coordenadasCapital));
    cmp.innerHTML='';
    const t=el('table',{class:'data'});
    const head=el('tr',{},el('th',{text:'Dato'}),el('th',{text:a.nombreES}),el('th',{text:b.nombreES}));
    t.appendChild(el('thead',{},head));
    const tb=el('tbody',{});
    function row(label,va,vb){tb.appendChild(el('tr',{},el('td',{},el('b',{text:label})),el('td',{html:va}),el('td',{html:vb})));}
    row('Bandera',`<img class="flag" src="${a.bandera}" alt="Bandera de ${a.nombreES}">`,`<img class="flag" src="${b.bandera}" alt="Bandera de ${b.nombreES}">`);
    row('Capital',a.tipoCapital==='dual'?'Sucre / La Paz':a.capitalPrincipal,b.tipoCapital==='dual'?'Sucre / La Paz':b.capitalPrincipal);
    row('Región',REGIONS[a.regionPedagogica].nombre,REGIONS[b.regionPedagogica].nombre);
    row('ISO alfa-2 / alfa-3',a.iso2.toUpperCase()+' / '+a.iso3,b.iso2.toUpperCase()+' / '+b.iso3);
    row('Ubicación capital',a.coordenadasCapital.lat.toFixed(1)+'°, '+a.coordenadasCapital.lng.toFixed(1)+'°',b.coordenadasCapital.lat.toFixed(1)+'°, '+b.coordenadasCapital.lng.toFixed(1)+'°');
    t.appendChild(tb);
    cmp.appendChild(el('div',{class:'panel'},
      el('div',{class:'row between',style:'margin-bottom:8px'},el('h3',{style:'margin:0',text:'Comparación'}),
        el('span',{class:'chip on',text:'Distancia entre capitales: ~'+dist.toLocaleString('es-AR')+' km'})),
      t));
    // errores habituales
    const rel=CONFUSABLES.filter(x=>[a.capitalPrincipal,b.capitalPrincipal,a.nombreES,b.nombreES].some(v=>x.a.includes(v)||x.b.includes(v)));
    if(rel.length){const w=el('div',{class:'panel',style:'margin-top:12px'},el('h3',{text:'Ojo con estos errores'}));
      rel.forEach(x=>w.appendChild(el('div',{class:'card',style:'margin-top:8px'},el('b',{text:x.a+' vs. '+x.b}),el('div',{class:'muted',style:'font-size:.86rem',text:x.nota}))));cmp.appendChild(w);}
  }
  draw();
}

/* ============================================================
   Vista: CONFIGURACIÓN Y ACCESIBILIDAD
   ============================================================ */
function viewConfig(root){
  if(Globe&&Globe.detach)Globe.detach();   // soltar el globo antes de vaciar
  root.innerHTML='';   // las vistas pueden re-renderizarse sobre sí mismas
  const c=Store.cfg();
  root.appendChild(viewHead('Configuración','Configuración y accesibilidad','Ajustá la app a tu gusto. Todo se guarda en este navegador; no se envía nada a ningún servidor.'));

  // Accesibilidad
  const acc=el('div',{class:'panel'},el('h3',{text:'Accesibilidad'}));
  acc.append(
    cfgRow('Movimiento','Reducí o desactivá las animaciones.',segEl([['auto','Automático'],['full','Completo'],['reduced','Reducido']],c.motion,v=>{Store.setCfg('motion',v);A11y.apply();})),
    cfgRow('Alto contraste','Aumentá el contraste de la interfaz.',switchCtl('Activar',c.contrast==='high',v=>{Store.setCfg('contrast',v?'high':'normal');A11y.apply();})),
    cfgRow('Tamaño de texto','Agrandá el texto de toda la app.',segEl([['0','Normal'],['1','Grande'],['2','Muy grande']],String(c.textsize),v=>{Store.setCfg('textsize',+v);A11y.apply();}))
  );
  root.appendChild(acc);

  // Globo y visuales
  const vis=el('div',{class:'panel',style:'margin-top:14px'},el('h3',{text:'Globo y visuales'}));
  const reAplicar=()=>{if(Globe.available)Globe.applyPrefs();};
  vis.append(
    cfgRow('Calidad gráfica','Bajá la calidad si el globo va lento.',segEl([['auto','Auto'],['alta','Alta'],['equilibrada','Equilibrada'],['baja','Bajo consumo']],c.quality,v=>{Store.setCfg('quality',v);A11y.apply();})),
    cfgRow('Estilo del globo',GLOBE_VIEW_ORDER.map(v=>GLOBE_VIEWS[v].label).join(' · '),
      segEl(GLOBE_VIEW_ORDER.map(v=>[v,GLOBE_VIEWS[v].label]),c.view,v=>{Store.setCfg('view',v);if(Globe.available)Globe.setView(v);})),
    cfgRow('Intensidad del relieve','Cuánto se marcan las montañas y los valles (estilos Relieve, Satélite y Nocturna).',
      rangeEl((c.relieve==null?60:c.relieve)/100,v=>{Store.setCfg('relieve',Math.round(v*100));reAplicar();},'Intensidad del relieve')),
    cfgRow('Meridianos y paralelos','Retícula de coordenadas sobre el globo.',switchCtl('Activar',c.meridianos!==false,v=>{Store.setCfg('meridianos',v);reAplicar();})),
    cfgRow('Separación de la retícula','Cada cuántos grados se dibuja una línea.',
      segEl([['10','10°'],['15','15°'],['20','20°'],['30','30°']],String(c.meridianosPaso||15),v=>{Store.setCfg('meridianosPaso',Number(v));reAplicar();})),
    cfgRow('Líneas con nombre','Ecuador, trópicos, círculos polares y meridiano de Greenwich.',switchCtl('Activar',c.lineasClave!==false,v=>{Store.setCfg('lineasClave',v);reAplicar();})),
    cfgRow('Resto del mundo','Dibuja los otros continentes como contexto. Nunca entran en el examen.',switchCtl('Activar',c.mundo!==false,v=>{Store.setCfg('mundo',v);reAplicar();})),
    cfgRow('Rotación automática','Girá el globo cuando está inactivo.',switchCtl('Activar',c.rotate,v=>{Store.setCfg('rotate',v);if(Globe.available)Globe.setRotate(v);})),
    cfgRow('Mostrar nombres','Etiqueta con el nombre de cada país sobre el globo.',switchCtl('Activar',c.labels,v=>{Store.setCfg('labels',v);if(Globe.available)Globe.setLabels(v);})),
    cfgRow('Banderas en las etiquetas','Miniatura de la bandera junto al nombre.',switchCtl('Activar',c.banderas!==false,v=>{Store.setCfg('banderas',v);reAplicar();})),
    cfgRow('Mostrar capitales','Marca y nombre de la capital de cada país.',switchCtl('Activar',c.capitals,v=>{Store.setCfg('capitals',v);if(Globe.available)Globe.setCapitals(v);}))
  );
  root.appendChild(vis);

  // Sonido
  const snd=el('div',{class:'panel',style:'margin-top:14px'},el('h3',{text:'Sonido'}));
  snd.append(
    cfgRow('Sonido y pronunciación','Efectos y lectura de nombres (Web Speech).',switchCtl('Activar',c.sound,v=>{Store.setCfg('sound',v);A11y.apply();if(v)Audio.resume();})),
    cfgRow('Volumen','',rangeEl(c.volume,v=>Store.setCfg('volume',v),'Volumen'))
  );
  root.appendChild(snd);

  // Nivel por defecto
  const lvl=el('div',{class:'panel',style:'margin-top:14px'},el('h3',{text:'Preferencias de estudio'}));
  lvl.append(
    cfgRow('Dificultad por defecto','',segEl([['principiante','Principiante'],['intermedio','Intermedio'],['avanzado','Avanzado'],['experto','Experto']],c.level,v=>Store.setCfg('level',v))),
    cfgRow('Región por defecto','',selectEl([['todas','Todas']].concat(REGION_ORDER.map(r=>[r,REGIONS[r].nombre])),c.region,v=>Store.setCfg('region',v)))
  );
  root.appendChild(lvl);

  // Diagnóstico
  const diag=el('div',{class:'panel',style:'margin-top:14px'},el('h3',{text:'Diagnóstico'}));
  const diagBody=el('div');
  diag.appendChild(diagBody);
  diag.appendChild(el('button',{class:'btn sm',style:'margin-top:10px',text:'Revisar de nuevo',onclick:()=>pintarDiag()}));
  root.appendChild(diag);
  function pintarDiag(){
    diagBody.innerHTML='';
    const filas=[
      ['WebGL / globo 3D',Globe.available?'Disponible':'No disponible — se usa el mapa 2D'],
      ['Estilo activo',(GLOBE_VIEWS[Store.cfg().view]||{}).label||Store.cfg().view],
      ['Países del examen',COUNTRIES.length+' de 35'],
      ['Geometrías cargadas',((window.__GEO&&window.__GEO.features)||[]).length+' países'],
      ['Contexto mundial',((window.__WORLD&&window.__WORLD.features)||[]).length+' países'+(window.__WORLD?'':' — no cargado')],
      ['Retícula',Store.cfg().meridianos!==false?('cada '+(Store.cfg().meridianosPaso||15)+'°'):'desactivada'],
      ['Almacenamiento local',(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return 'OK';}catch(e){return 'No disponible (el progreso no se guardará)';}})()],
    ];
    filas.forEach(([k,v])=>diagBody.appendChild(kvRow(k,v)));
    Object.keys(GLOBE_TEX).forEach(k=>{
      const url=GLOBE_TEX[k];
      const fila=kvRow('Textura '+k,'verificando…');
      diagBody.appendChild(fila);
      const im=new Image();
      im.onload=()=>{fila.querySelector('.v').textContent='OK ('+im.naturalWidth+'×'+im.naturalHeight+')';};
      im.onerror=()=>{fila.querySelector('.v').textContent='FALTA — '+url;fila.querySelector('.v').style.color='var(--bad)';};
      im.src=url;
    });
  }
  pintarDiag();

  // Datos y privacidad
  const data=el('div',{class:'panel',style:'margin-top:14px'},el('h3',{text:'Datos y privacidad'}));
  data.appendChild(el('p',{class:'dim',text:'Tu progreso, configuración e historial se guardan únicamente en el almacenamiento local de este navegador. No se recopilan datos personales ni se usan rastreadores.'}));
  data.appendChild(el('div',{class:'row',style:'flex-wrap:wrap'},
    el('button',{class:'btn',text:'Exportar progreso (JSON)',onclick:exportData}),
    el('button',{class:'btn',text:'Importar progreso',onclick:importData}),
    el('button',{class:'btn',style:'border-color:var(--bad);color:var(--bad)',text:'Reiniciar datos',onclick:resetData})));
  root.appendChild(data);

  function exportData(){
    try{const blob=new Blob([Store.exportJSON()],{type:'application/json'});
      const url=URL.createObjectURL(blob);const a=el('a',{href:url,download:'atlas-america-3d-progreso.json'});
      document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      UI.toast('Progreso exportado','ok','Se descargó atlas-america-3d-progreso.json');
    }catch(e){UI.toast('No se pudo exportar','bad',e.message);}
  }
  function importData(){
    const inp=el('input',{type:'file',accept:'application/json,.json',style:'display:none',onchange:e=>{
      const file=e.target.files[0];if(!file)return;const rd=new FileReader();
      rd.onload=()=>{try{Store.importJSON(rd.result);UI.toast('Progreso importado','ok','Se cargaron tus datos');A11y.apply();viewConfig(root);}
        catch(err){UI.toast('Archivo inválido','bad','No se pudo importar: '+err.message);}};
      rd.onerror=()=>UI.toast('Error al leer el archivo','bad');rd.readAsText(file);}});
    document.body.appendChild(inp);inp.click();inp.remove();
  }
  async function resetData(){
    const ok=await UI.confirm('Se borrará todo tu progreso, historial y configuración de este navegador. Esta acción no se puede deshacer.',{title:'Reiniciar datos',okText:'Sí, borrar todo',danger:true});
    if(ok){Store.reset();A11y.apply();UI.toast('Datos reiniciados','ok');viewConfig(root);}
  }
}
function cfgRow(title,desc,control){
  return el('div',{class:'row between',style:'padding:12px 0;border-bottom:1px solid var(--border-2);gap:14px;flex-wrap:wrap'},
    el('div',{style:'flex:1;min-width:180px'},el('b',{text:title}),desc?el('div',{class:'muted',style:'font-size:.85rem',text:desc}):null),
    control);
}
function rangeEl(value,onChange,label){
  return el('input',{type:'range',min:'0',max:'1',step:'0.05',value:String(value),'aria-label':label||'Volumen',
    oninput:e=>onChange(parseFloat(e.target.value))});
}
